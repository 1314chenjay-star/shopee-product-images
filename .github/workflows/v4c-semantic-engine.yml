name: V4-C2 Semantic Evidence Engine - Preservation Hold

on:
  workflow_dispatch:
  push:
    branches:
      - v4c-universal-product-engine
    paths:
      - ".github/workflows/v4c-semantic-engine.yml"

permissions:
  contents: read
  actions: read

# Same group as the prior full semantic run. This intentionally cancels any
# in-progress V4-C2 semantic expansion when the Preservation Gate takes over.
concurrency:
  group: v4c2-semantic-evidence
  cancel-in-progress: true

env:
  V4C1_BASELINE_HEAD: a7447b792e65780bc95aa248b9e3a2fd0466f142
  STABLE_HEAD: 5d49f061e140813b3d229520e9e530f86b27b640

jobs:
  preservation_hold:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm V4-C2 full semantic is paused for Preservation Gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor $env:V4C1_BASELINE_HEAD HEAD
          if ($LASTEXITCODE -ne 0) { throw 'HEAD is not descended from frozen V4-C1 baseline' }
          $stableLine = git ls-remote origin refs/heads/tinysnow-tool-only
          $stableHead = ($stableLine -split '\s+')[0]
          if ($stableHead -ne $env:STABLE_HEAD) { throw "Stable HEAD changed: $stableHead" }
          Write-Host 'V4C2_FULL_SEMANTIC_PAUSED=true'
          Write-Host 'PRESERVATION_GATE_REQUIRED_BEFORE_SEMANTIC=true'
          Write-Host 'SOURCE_PIPELINE_REDOWNLOAD=false'
          Write-Host 'IMAGE_GENERATION_CALLED=false'
          Write-Host 'TINY_SNOW_API_CALLED=false'
          Write-Host 'PAID_API_CALLED=false'
