name: V4-B TinySnow Verified Overlay R6

on:
  push:
    branches:
      - v4b-original-image-localization

jobs:
  live-overlay-r6:
    if: github.event.head_commit.message == 'RUN-V4B-LIVE-OVERLAY-R6'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Normalize PowerShell encoding
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\_system\start\encoding_fix.ps1

      - name: V4-B static gates
        shell: powershell
        run: |
          & .\_system\tests\v4b_planner_smoke.ps1
          & .\_system\tests\v4b_source_conflict_smoke.ps1
          & .\_system\tests\v4b_verified_overlay_smoke.ps1

      - name: TinySnow 580 + 529 verified-overlay live
        shell: powershell
        env:
          TINYSNOW_API_KEY: ${{ secrets.TINYSNOW_API_KEY }}
          V4B_SAFETY_ROUND: R6
          V4B_SAFETY_SLUG: r6
          V4B_ARTIFACT_NAME: TinySnow-V4-B-Verified-Overlay-R6
        run: |
          & .\_system\tests\v4b_live_safety_r2.ps1

      - name: Upload V4-B verified-overlay artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow-V4-B-Verified-Overlay-R6
          path: _system/live_e2e_output_v4b_safety_r6/
          if-no-files-found: ignore
