name: V4-B Source Review 580

on:
  push:
    branches:
      - v4b-original-image-localization

jobs:
  source-review-580:
    if: github.event.head_commit.message == 'RUN-V4B-SOURCE-REVIEW-580'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Normalize PowerShell encoding
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\_system\start\encoding_fix.ps1

      - name: Download and plan 580 sources without TinySnow
        shell: powershell
        run: |
          & .\_system\tests\v4b_source_review_580.ps1

      - name: Upload all 580 originals
        uses: actions/upload-artifact@v4
        with:
          name: V4-B-580-All-Originals
          path: _system/source_review_v4b_580/
