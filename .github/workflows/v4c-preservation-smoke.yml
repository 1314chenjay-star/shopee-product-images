name: V4-C2.0 Preservation Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - v4c-universal-product-engine
    paths:
      - ".github/workflows/v4c-preservation-smoke.yml"
      - "_system/tests/v4c_preservation_*.ps1"
      - "_system/tests/v4c_preservation_worker.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: v4c2-preservation-smoke
  cancel-in-progress: true

env:
  V4C1_BASELINE_HEAD: a7447b792e65780bc95aa248b9e3a2fd0466f142
  STABLE_HEAD: 5d49f061e140813b3d229520e9e530f86b27b640
  REQUIREMENTS: _system/v4c/preservation/requirements.txt

jobs:
  preservation_smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen baselines and parse new PowerShell only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem _system\tests\v4c_preservation_*.ps1 | ForEach-Object {
            $null = [scriptblock]::Create((Get-Content $_.FullName -Raw -Encoding UTF8))
            Write-Host "PS51_PARSE_OK=$($_.Name)"
          }
          git merge-base --is-ancestor $env:V4C1_BASELINE_HEAD HEAD
          if ($LASTEXITCODE -ne 0) { throw 'HEAD not descended from frozen V4-C1 baseline' }
          $stableLine = git ls-remote origin refs/heads/tinysnow-tool-only
          $stableHead = ($stableLine -split '\s+')[0]
          if ($stableHead -ne $env:STABLE_HEAD) { throw "Stable HEAD changed: $stableHead" }
          $protected = @('_system/v4c/inventory/source_inventory.jsonl','_system/v4c/progress/v4c_source_progress.jsonl','_system/v4c/results/source_evidence.jsonl','_system/v4c/results/duplicate_map.json','_system/v4c/results/failed_sources.json','_system/v4c/results/semantic_evidence_queue.jsonl','_system/v4c/results/aggregate_summary.json','_system/v4c/results/validation.json','_system/start/api_v2.ps1')
          git diff --quiet $env:V4C1_BASELINE_HEAD -- $protected
          if ($LASTEXITCODE -ne 0) { throw 'Frozen V4-C1 evidence or api_v2.ps1 changed' }
          Write-Host 'V4C1_TURBO_RETESTED=false'
          Write-Host 'V4B_STABLE_RETESTED=false'
          Write-Host 'IMAGE_GENERATION_CALLED=false'
          Write-Host 'TINY_SNOW_API_CALLED=false'
      - name: Build 100-200 image Preservation Smoke manifest
        shell: powershell
        run: |
          .\_system\tests\v4c_preservation_plan.ps1 -OutDir artifacts\plan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ env.REQUIREMENTS }}
      - name: Install free local preservation dependencies
        shell: powershell
        run: python -m pip install --disable-pip-version-check -r $env:REQUIREMENTS
      - name: Compile preservation worker
        shell: powershell
        run: python -m py_compile .\_system\tests\v4c_preservation_worker.py
      - name: Checkpoint seed first 25 images
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts\work | Out-Null
          python .\_system\tests\v4c_preservation_worker.py --manifest artifacts\plan\preservation_smoke_manifest.jsonl --progress artifacts\work\preservation_progress.jsonl --summary artifacts\work\seed_summary.json --cache-dir artifacts\cache --max-items 25
      - name: Resume checkpoint and finish smoke
        shell: powershell
        run: |
          python .\_system\tests\v4c_preservation_worker.py --manifest artifacts\plan\preservation_smoke_manifest.jsonl --progress artifacts\work\preservation_progress.jsonl --summary artifacts\work\resume_summary.json --cache-dir artifacts\cache
          $resume = Get-Content artifacts\work\resume_summary.json -Raw | ConvertFrom-Json
          if ([int]$resume.checkpoint_skipped_this_run -lt 25) { throw 'Checkpoint did not skip first 25 terminal images' }
          Write-Host 'CHECKPOINT_RESUME_OBSERVED=true'
      - name: Aggregate per-image and per-product preservation state
        shell: powershell
        run: |
          .\_system\tests\v4c_preservation_aggregate.ps1 -ProgressPath artifacts\work\preservation_progress.jsonl -ManifestPath artifacts\plan\preservation_smoke_manifest.jsonl -OutDir artifacts\aggregate
      - name: Prove confirmed SHA direct SKIP without fetch or OCR
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts\history-replay | Out-Null
          python .\_system\tests\v4c_preservation_worker.py --manifest artifacts\aggregate\history_replay_manifest.jsonl --progress artifacts\history-replay\progress.jsonl --confirmed-sha artifacts\aggregate\confirmed_sha256_from_smoke.jsonl --summary artifacts\history-replay\summary.json --cache-dir artifacts\history-replay-cache
          $history = Get-Content artifacts\history-replay\summary.json -Raw | ConvertFrom-Json
          if ([int]$history.history_skip_this_run -lt 1) { throw 'No SHA history direct SKIP observed' }
          if ([int]$history.network_fetch_this_run -ne 0 -or [int]$history.ocr_this_run -ne 0) { throw 'SHA history replay unexpectedly fetched/analyzed an image' }
          Write-Host 'HISTORICAL_SHA_DIRECT_SKIP=true'
      - name: Validate Preservation Smoke
        shell: powershell
        run: |
          .\_system\tests\v4c_preservation_validate.ps1 -ManifestPath artifacts\plan\preservation_smoke_manifest.jsonl -AggregateDir artifacts\aggregate -ResumeSummaryPath artifacts\work\resume_summary.json -HistoryReplaySummaryPath artifacts\history-replay\summary.json -OutputPath artifacts\aggregate\validation.json -ExpectedStableHead $env:STABLE_HEAD -V4C1BaselineHead $env:V4C1_BASELINE_HEAD
      - name: Merge smoke-PASS Preservation Gate into V4-C experimental branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force _system\v4c\preservation\progress | Out-Null
          New-Item -ItemType Directory -Force _system\v4c\preservation\results | Out-Null
          Copy-Item artifacts\aggregate\preservation_ledger.jsonl _system\v4c\preservation\progress\preservation_ledger.jsonl -Force
          Copy-Item artifacts\aggregate\image_preservation.jsonl _system\v4c\preservation\results\image_preservation.jsonl -Force
          Copy-Item artifacts\aggregate\preservation_semantic_queue.jsonl _system\v4c\preservation\results\preservation_semantic_queue.jsonl -Force
          Copy-Item artifacts\aggregate\product_preservation_summary.jsonl _system\v4c\preservation\results\product_preservation_summary.jsonl -Force
          Copy-Item artifacts\aggregate\preservation_summary.json _system\v4c\preservation\results\preservation_summary.json -Force
          Copy-Item artifacts\aggregate\validation.json _system\v4c\preservation\results\validation.json -Force
          Copy-Item artifacts\aggregate\confirmed_sha256_from_smoke.jsonl _system\v4c\preservation\confirmed_sha256.jsonl -Force
          $v = Get-Content artifacts\aggregate\validation.json -Raw | ConvertFrom-Json
          $lock = [ordered]@{
            schema_version = 'v4c2.0.preservation-gate-lock.1'
            smoke_passed = $true
            workflow_run = $env:GITHUB_RUN_ID
            v4c1_baseline_head = $env:V4C1_BASELINE_HEAD
            stable_head = $env:STABLE_HEAD
            smoke_count = [int]$v.smoke_count
            preserve_count = [int]$v.preserve_count
            semantic_required_count = [int]$v.semantic_required_count
            mixed_partial_products = [int]$v.mixed_partial_products
            sha_reuse_13_to_7 = $true
            checkpoint_resume_observed = $true
            historical_sha_direct_skip = $true
            image_generation_called = $false
            tiny_snow_api_called = $false
            paid_api_called = $false
            source_pipeline_redownload = $false
            v4c1_turbo_retested = $false
            v4b_stable_retested = $false
          }
          $lock | ConvertTo-Json -Depth 20 | Set-Content _system\v4c\preservation\PRESERVATION_GATE_LOCK.json -Encoding UTF8
          git config user.name 'TinySnow V4-C2 Preservation'
          git config user.email 'actions@users.noreply.github.com'
          git add _system/v4c/preservation
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'V4-C2.0 Preservation Gate smoke PASS'
            git push origin HEAD:v4c-universal-product-engine
          }
      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-preservation-smoke
          path: |
            artifacts/plan
            artifacts/work
            artifacts/aggregate
            artifacts/history-replay
          if-no-files-found: error
          retention-days: 14
