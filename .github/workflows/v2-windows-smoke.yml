name: V2 Windows Smoke Test

on:
  push:
    branches:
      - tinysnow-tool-only
      - v4a1-factual-guard
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Normalize PowerShell encoding
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\_system\start\encoding_fix.ps1

      - name: Existing V4-A PowerShell smoke
        shell: powershell
        run: |
          & .\_system\tests\windows_smoke.ps1

      - name: V4-A.1 factual guard smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a1_windows_smoke.ps1

      - name: V4-A.1 visual quantity truth smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a1_visual_truth_smoke.ps1

      - name: V4-A.2 Reference Safety smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a2_reference_safety_smoke.ps1

      - name: V4-A.2 exact text hardening smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a2_text_hardening_smoke.ps1

      - name: Build Windows test package
        shell: powershell
        run: |
          $short = $env:GITHUB_SHA.Substring(0,7)
          $package = "TinySnow_V4-A.2_ReferenceSafety_$short.zip"
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' -and $_.Name -ne $package } | Compress-Archive -DestinationPath $package -Force
          "PACKAGE_NAME=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow-V4-A.2-ReferenceSafety
          path: ${{ env.PACKAGE_NAME }}
