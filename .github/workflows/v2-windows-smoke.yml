name: V2 Windows Smoke Test

on:
  push:
    branches:
      - tinysnow-tool-only
      - v4a1-factual-guard
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Normalize PowerShell encoding
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\_system\start\encoding_fix.ps1

      - name: Existing V4-A PowerShell smoke
        shell: powershell
        run: |
          & .\_system\tests\windows_smoke.ps1

      - name: V4-A.1 factual guard smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a1_windows_smoke.ps1

      - name: V4-A.1 visual quantity truth smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a1_visual_truth_smoke.ps1

      - name: V4-A.2 Reference Safety smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a2_reference_safety_smoke.ps1

      - name: V4-A.2 exact text hardening smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a2_text_hardening_smoke.ps1

      - name: Build clean Windows package
        shell: powershell
        run: |
          $short = $env:GITHUB_SHA.Substring(0,7)
          $package = "TinySnow_V4-A.2_ReferenceSafety_$short.zip"
          $stage = Join-Path $env:RUNNER_TEMP 'TinySnow_V4-A.2_Distribution'
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item -LiteralPath '.\START.bat' -Destination $stage -Force
          Copy-Item -LiteralPath '.\README_新手使用說明.txt' -Destination $stage -Force
          Copy-Item -LiteralPath '.\V2_BUILD.txt' -Destination $stage -Force

          $stageSystem = Join-Path $stage '_system'
          New-Item -ItemType Directory -Path $stageSystem -Force | Out-Null
          foreach ($dir in @('config','start','tools')) {
            Copy-Item -LiteralPath (Join-Path '.\_system' $dir) -Destination $stageSystem -Recurse -Force
          }
          $runtimeConfig = Join-Path $stageSystem 'config\config.json'
          if (Test-Path -LiteralPath $runtimeConfig) { Remove-Item -LiteralPath $runtimeConfig -Force }

          # Runtime creates these on first use. Create clean empty directories only; never package CI workspace data.
          foreach ($dir in @('workspace','logs','reports','output')) {
            New-Item -ItemType Directory -Path (Join-Path $stageSystem $dir) -Force | Out-Null
          }
          New-Item -ItemType Directory -Path (Join-Path $stage '已生成圖片') -Force | Out-Null

          if (Test-Path -LiteralPath $package) { Remove-Item -LiteralPath $package -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $package -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $package))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName -replace '\\','/' })
            foreach ($required in @(
              'START.bat','V2_BUILD.txt','_system/start/api_v2.ps1','_system/start/menu_beginner.ps1',
              '_system/start/v4a1_guard.ps1','_system/start/v4a2_reference_safety.ps1',
              '_system/start/v4a2_reference_hardening.ps1','_system/start/v4a2_reference_hardening_r2.ps1',
              '_system/config/factual_rules_v4a1.json'
            )) {
              if ($names -notcontains $required) { throw ('Distribution package missing: ' + $required) }
            }
            foreach ($forbidden in @('.github/','_system/tests/','_system/live_e2e_output/','_system/workspace/selected_product.json','_system/config/config.json')) {
              if (@($names | Where-Object { $_ -eq $forbidden -or $_.StartsWith($forbidden) }).Count -gt 0) {
                throw ('Distribution package contains forbidden CI/runtime artifact: ' + $forbidden)
              }
            }
          }
          finally { $zip.Dispose() }

          "PACKAGE_NAME=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow-V4-A.2-ReferenceSafety
          path: ${{ env.PACKAGE_NAME }}
