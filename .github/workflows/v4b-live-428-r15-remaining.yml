name: V4-B 428 R15 Remaining Slots

on:
  push:
    branches:
      - v4b-original-image-localization

jobs:
  live-428-r15:
    if: github.event.head_commit.message == 'RUN-V4B-428-R15-REMAINING'
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slot: [detail2, detail3, detail4]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Normalize PowerShell encoding
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\_system\start\encoding_fix.ps1

      - name: V4-B 428 static gates
        shell: powershell
        run: |
          & .\_system\tests\v4b_planner_smoke.ps1
          & .\_system\tests\v4b_source_conflict_smoke.ps1
          & .\_system\tests\v4b_428_apparel_guard_smoke.ps1
          & .\_system\tests\v4b_verified_overlay_smoke.ps1
          & .\_system\tests\v4b_report_metadata_smoke.ps1

      - name: TinySnow 428 ${{ matrix.slot }} R15
        shell: powershell
        env:
          TINYSNOW_API_KEY: ${{ secrets.TINYSNOW_API_KEY }}
          V4B_428_SLOT: ${{ matrix.slot }}
        run: |
          & .\_system\tests\v4b_live_428_single_slot_r15.ps1

      - name: Upload V4-B 428 R15 payload
        id: payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow-V4-B-428-R15-${{ matrix.slot }}
          path: _system/live_e2e_output_v4b_428_r15_${{ matrix.slot }}/
          if-no-files-found: ignore

      - name: Record R15 payload artifact receipt
        if: always() && steps.payload.outputs.artifact-id != ''
        shell: powershell
        env:
          SLOT: ${{ matrix.slot }}
          PAYLOAD_ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
          PAYLOAD_ARTIFACT_URL: ${{ steps.payload.outputs.artifact-url }}
        run: |
          $receiptDir = '.\_system\live_e2e_output_v4b_428_r15_' + $env:SLOT + '_receipt'
          New-Item -ItemType Directory -Path $receiptDir -Force | Out-Null
          [pscustomobject]@{
            schema_version = 1
            version = 'V4-B 428 R15'
            round = 'R15'
            slot = $env:SLOT
            head_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            workflow_name = $env:GITHUB_WORKFLOW
            repository = $env:GITHUB_REPOSITORY
            artifact_name = ('TinySnow-V4-B-428-R15-' + $env:SLOT)
            artifact_id = $env:PAYLOAD_ARTIFACT_ID
            artifact_role = 'payload'
            artifact_url = $env:PAYLOAD_ARTIFACT_URL
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $receiptDir ('v4b_428_r15_' + $env:SLOT + '_artifact_receipt.json')) -Encoding UTF8

      - name: Upload V4-B 428 R15 receipt
        if: always() && steps.payload.outputs.artifact-id != ''
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow-V4-B-428-R15-${{ matrix.slot }}-Receipt
          path: _system/live_e2e_output_v4b_428_r15_${{ matrix.slot }}_receipt/
          if-no-files-found: error
