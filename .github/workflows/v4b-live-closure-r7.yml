name: V4-B Closure R7 Main Detail2

on:
  push:
    branches:
      - v4b-original-image-localization

jobs:
  live-closure-r7:
    if: github.event.head_commit.message == 'RUN-V4B-CLOSURE-R7'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Normalize PowerShell encoding
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\_system\start\encoding_fix.ps1

      - name: V4-B closure static gates
        shell: powershell
        run: |
          & .\_system\tests\v4b_planner_smoke.ps1
          & .\_system\tests\v4b_source_conflict_smoke.ps1
          & .\_system\tests\v4b_verified_overlay_smoke.ps1
          & .\_system\tests\v4b_report_metadata_smoke.ps1

      - name: TinySnow 580 main and detail2 closure R7
        shell: powershell
        env:
          TINYSNOW_API_KEY: ${{ secrets.TINYSNOW_API_KEY }}
          V4B_ARTIFACT_NAME: TinySnow-V4-B-Closure-R7
        run: |
          & .\_system\tests\v4b_live_closure_r7.ps1

      - name: Upload V4-B Closure R7 payload
        id: payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow-V4-B-Closure-R7
          path: _system/live_e2e_output_v4b_closure_r7/
          if-no-files-found: ignore

      - name: Record payload artifact receipt
        if: always() && steps.payload.outputs.artifact-id != ''
        shell: powershell
        env:
          PAYLOAD_ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
          PAYLOAD_ARTIFACT_URL: ${{ steps.payload.outputs.artifact-url }}
        run: |
          $receiptDir = '.\_system\live_e2e_output_v4b_closure_r7_receipt'
          New-Item -ItemType Directory -Path $receiptDir -Force | Out-Null
          [pscustomobject]@{
            schema_version = 1
            version = 'V4-B Closure R7'
            round = 'R7'
            head_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            workflow_name = $env:GITHUB_WORKFLOW
            repository = $env:GITHUB_REPOSITORY
            artifact_name = 'TinySnow-V4-B-Closure-R7'
            artifact_id = $env:PAYLOAD_ARTIFACT_ID
            artifact_role = 'payload'
            artifact_url = $env:PAYLOAD_ARTIFACT_URL
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $receiptDir 'v4b_closure_r7_artifact_receipt.json') -Encoding UTF8
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('V4-B Closure R7 payload artifact ID: ' + $env:PAYLOAD_ARTIFACT_ID)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('Head SHA: ' + $env:GITHUB_SHA + ' | Run ID: ' + $env:GITHUB_RUN_ID)

      - name: Upload V4-B Closure R7 artifact receipt
        if: always() && steps.payload.outputs.artifact-id != ''
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow-V4-B-Closure-R7-Receipt
          path: _system/live_e2e_output_v4b_closure_r7_receipt/
          if-no-files-found: error
