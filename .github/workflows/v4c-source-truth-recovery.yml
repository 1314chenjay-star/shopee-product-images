name: V4-C5.3 Source Truth Replacement Recovery

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tinysnow-c5-3-replacement-recovery
  cancel-in-progress: false

jobs:
  replacement-recovery:
    runs-on: ubuntu-latest
    env:
      TINYSNOW_TARGET_BRANCH: v4c-universal-product-engine
    steps:
      - name: Checkout active V4-C branch
        uses: actions/checkout@v4
        with:
          ref: v4c-universal-product-engine
          fetch-depth: 0

      - name: Determine whether recovery work remains
        id: state
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          q=[json.loads(x) for x in open('_system/agent_queue/queue.jsonl',encoding='utf-8-sig') if x.strip()]
          t=next((x for x in q if x.get('task_id')=='TASK-C5-3-SOURCE-TRUTH-REPAIR'),None)
          if t is None: value='false'
          elif t.get('status') in {'PENDING','RECOVERING'}: value='true'
          elif t.get('status') in {'SUCCESS','COMPLETED'}: value='false'
          elif t.get('owner_decision_required') or t.get('paid') or t.get('generation'): value='false'
          else: raise SystemExit('UNEXPECTED_C5_3_QUEUE_STATE:'+str(t.get('status')))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write('should_run='+value+'\n')
          PY

      - name: Control plane preflight
        if: steps.state.outputs.should_run == 'true'
        run: |
          python -m py_compile _system/control/control_plane_preflight.py
          python -B _system/control/control_plane_preflight.py --role WORKER --write-intent implementation

      - name: Guard stable and preserved checkpoint
        if: steps.state.outputs.should_run == 'true'
        shell: bash
        env:
          TINYSNOW_STABLE_HEAD_EXPECTED: 5d49f061e140813b3d229520e9e530f86b27b640
        run: |
          set -euo pipefail
          STABLE=$(git ls-remote origin refs/heads/tinysnow-tool-only | awk '{print $1}')
          test "$STABLE" = "$TINYSNOW_STABLE_HEAD_EXPECTED"
          python - <<'PY'
          import json
          cp=json.load(open('_system/control/execution_checkpoint.json',encoding='utf-8-sig'))
          q=[json.loads(x) for x in open('_system/agent_queue/queue.jsonl',encoding='utf-8-sig') if x.strip()]
          t=next(x for x in q if x['task_id']=='TASK-C5-3-SOURCE-TRUTH-REPAIR')
          assert t['status'] in {'PENDING','RECOVERING'}
          assert t['checkpoint']==cp['checkpoint']
          assert not t['paid'] and not t['generation'] and not t['owner_decision_required']
          PY

      - name: Validate queue and replacement decision
        if: steps.state.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -B _system/agent_queue/validate_agent_queue.py
          python -B _system/agent_queue/watchdog.py

      - name: Persist replacement heartbeat and completed checkpoint evidence
        if: steps.state.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v4c-universal-product-engine --quiet
          git merge --ff-only origin/v4c-universal-product-engine
          python - <<'PY'
          import datetime as dt, json, pathlib, subprocess
          root=pathlib.Path('.')
          now=dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z')
          actual_head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          cp_path=root/'_system/control/execution_checkpoint.json'; live_path=root/'_system/control/live_status.json'; worker_path=root/'_system/control/worker_state.json'
          cp=json.loads(cp_path.read_text(encoding='utf-8-sig')); live=json.loads(live_path.read_text(encoding='utf-8-sig')); worker=json.loads(worker_path.read_text(encoding='utf-8-sig'))
          completed=list(cp.get('completed',[])); pending=list(cp.get('pending',[]))
          def complete(name):
              if name in pending: pending.remove(name)
              if name not in completed: completed.append(name)
          complete('agent queue/watchdog validation')
          cp['completed']=completed; cp['pending']=pending; cp['last_good_head']=actual_head; cp['last_replacement_heartbeat_utc']=now
          live.update({'status':'RECOVERING','checkpoint':cp['checkpoint'],'last_update':now,'worker_state':'RECOVERING','next_action':('Resume first pending delta only: '+pending[0]) if pending else 'C5.3 pending list empty; validate seal','original_task_retry_allowed':False,'sealed_data_modified':False})
          worker.update({'status':'RECOVERING','last_heartbeat_utc':now,'last_durable_worker_signal_utc':now,'resume_mode':'FIRST_PENDING_DELTA_ONLY','original_task_retry_allowed':False,'human_orchestration_required':False})
          cp_path.write_text(json.dumps(cp,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); live_path.write_text(json.dumps(live,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); worker_path.write_text(json.dumps(worker,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "TinySnow Replacement Worker"
          git config user.email "actions@users.noreply.github.com"
          git add _system/control/execution_checkpoint.json _system/control/live_status.json _system/control/worker_state.json
          if ! git diff --cached --quiet; then
            git commit -m "control: persist replacement heartbeat and checkpoint [skip ci]"
            git push origin HEAD:v4c-universal-product-engine
          fi

      - name: Upload replacement recovery evidence
        if: steps.state.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v4c-c5-3-replacement-recovery-${{ github.run_id }}
          path: |
            _system/agent_queue/validation.json
            _system/agent_queue/recovery_report.json
            _system/control/execution_checkpoint.json
            _system/control/live_status.json
            _system/control/worker_state.json
          if-no-files-found: error
          retention-days: 14
