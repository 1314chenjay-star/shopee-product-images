name: V4-C5.3 Source Truth Replacement Recovery

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  replacement-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active V4-C branch
        uses: actions/checkout@v4
        with:
          ref: v4c-universal-product-engine
          fetch-depth: 0

      - name: Guard stable and preserved checkpoint
        shell: bash
        env:
          TINYSNOW_STABLE_HEAD_EXPECTED: 5d49f061e140813b3d229520e9e530f86b27b640
        run: |
          set -euo pipefail
          STABLE=$(git ls-remote origin refs/heads/tinysnow-tool-only | awk '{print $1}')
          test "$STABLE" = "$TINYSNOW_STABLE_HEAD_EXPECTED"
          python - <<'PY'
          import json
          cp=json.load(open('_system/control/execution_checkpoint.json',encoding='utf-8-sig'))
          q=[json.loads(x) for x in open('_system/agent_queue/queue.jsonl',encoding='utf-8-sig') if x.strip()]
          assert cp['stage']=='V4-C5.3 Source Truth Repair'
          t=next(x for x in q if x['task_id']=='TASK-C5-3-SOURCE-TRUTH-REPAIR')
          assert t['status'] in {'PENDING','RECOVERING'}
          assert not t['paid'] and not t['generation'] and not t['owner_decision_required']
          print('REPLACEMENT_RECOVERY_GUARD_PASS', cp['checkpoint'])
          PY

      - name: Validate queue and replacement decision
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -B _system/agent_queue/validate_agent_queue.py
          python -B _system/agent_queue/watchdog.py
          python - <<'PY'
          import json
          r=json.load(open('_system/agent_queue/recovery_report.json',encoding='utf-8'))
          assert r['decision'] in {'AUTO_RECOVER','WAIT_ACTIVE'}, r
          assert r['original_task_retried'] is False
          assert r['sealed_stage_rerun'] is False
          assert r['paid_api_called'] is False
          assert r['image_generation_called'] is False
          print('WATCHDOG_REPLACEMENT_PATH_PASS', r['decision'])
          PY

      - name: Persist replacement heartbeat and completed checkpoint evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt, json, pathlib
          root=pathlib.Path('.')
          now=dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z')
          cp_path=root/'_system/control/execution_checkpoint.json'
          live_path=root/'_system/control/live_status.json'
          worker_path=root/'_system/control/worker_state.json'
          manifest_path=root/'_system/source_truth/bootstrap_manifest/manifest.json'
          cp=json.loads(cp_path.read_text(encoding='utf-8-sig'))
          live=json.loads(live_path.read_text(encoding='utf-8-sig'))
          worker=json.loads(worker_path.read_text(encoding='utf-8-sig'))
          completed=list(cp.get('completed',[])); pending=list(cp.get('pending',[]))

          def complete(name):
              nonlocal_marker = None
              if name in pending:
                  pending.remove(name)
              if name not in completed:
                  completed.append(name)

          # This workflow itself is the proof for the first pending control-layer delta.
          complete('agent queue/watchdog validation')

          # Do not recompute the workbook. Fingerprint already-captured authoritative evidence only.
          if manifest_path.exists():
              m=json.loads(manifest_path.read_text(encoding='utf-8-sig'))
              if (m.get('authoritative_workbook',{}).get('sha256') == '616d1c0639f34433ebe244678f101458e375c1c095677be7d9f5736b2ccecb9a'
                  and m.get('row_counts') == {'gallery_images':2394,'products':375,'variant_options':2673}):
                  complete('authoritative workbook SHA validation')

          cp['completed']=completed
          cp['pending']=pending
          cp['checkpoint']='SOURCE_MANIFEST_TRANSPORT' if pending and pending[0]=='source manifest extraction' else cp.get('checkpoint')
          cp['last_good_head']='${{ github.sha }}'
          cp['last_replacement_heartbeat_utc']=now

          live.update({
              'status':'RECOVERING',
              'stage':'V4-C5.3 Source Truth Repair',
              'checkpoint':cp['checkpoint'],
              'last_update':now,
              'worker_state':'RECOVERING',
              'next_action':('Resume first pending delta only: '+pending[0]) if pending else 'C5.3 pending list empty; validate seal',
              'original_task_retry_allowed':False,
              'sealed_data_modified':False
          })
          worker.update({
              'status':'RECOVERING',
              'stage':'V4-C5.3 Source Truth Repair',
              'last_heartbeat_utc':now,
              'last_durable_worker_signal_utc':now,
              'resume_mode':'FIRST_PENDING_DELTA_ONLY',
              'original_task_retry_allowed':False,
              'human_orchestration_required':False
          })
          cp_path.write_text(json.dumps(cp,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          live_path.write_text(json.dumps(live,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          worker_path.write_text(json.dumps(worker,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('HEARTBEAT_PERSIST_READY', now, 'NEXT', pending[0] if pending else 'NONE')
          PY

          git config user.name "TinySnow Replacement Worker"
          git config user.email "actions@users.noreply.github.com"
          git add _system/control/execution_checkpoint.json _system/control/live_status.json _system/control/worker_state.json
          if ! git diff --cached --quiet; then
            git commit -m "control: persist replacement heartbeat and checkpoint [skip ci]"
            git push origin HEAD:v4c-universal-product-engine
          fi

      - name: Upload replacement recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: v4c-c5-3-replacement-recovery-${{ github.run_id }}
          path: |
            _system/agent_queue/validation.json
            _system/agent_queue/recovery_report.json
            _system/control/stalled_execution_report.json
            _system/control/execution_checkpoint.json
            _system/control/live_status.json
            _system/control/worker_state.json
          if-no-files-found: error
          retention-days: 14
