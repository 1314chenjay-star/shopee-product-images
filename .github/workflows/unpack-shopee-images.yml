name: Unpack Shopee image batches

on:
  push:
    paths:
      - 'upload_chunks/*/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and unpack ready batches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for ready in upload_chunks/*/READY; do
            dir="$(dirname "$ready")"
            id="$(basename "$dir")"
            parts=("$dir"/part-*.b64)
            if [ ${#parts[@]} -eq 0 ]; then
              echo "No parts for $id"
              exit 1
            fi
            cat "${parts[@]}" > "/tmp/${id}.b64"
            base64 -d "/tmp/${id}.b64" > "/tmp/${id}.zip"
            unzip -t "/tmp/${id}.zip"
            unzip -o "/tmp/${id}.zip" -d .
            rm -rf "$dir"
          done

      - name: Commit extracted images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted image changes to commit."
            exit 0
          fi
          git commit -m "Extract Shopee product images [skip ci]"
          git push
