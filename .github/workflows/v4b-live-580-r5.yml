name: V4-B TinySnow 580 R5

on:
  push:
    branches:
      - v4b-original-image-localization

jobs:
  live-580-r5:
    if: github.event.head_commit.message == 'RUN-V4B-LIVE-580-R5'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Normalize PowerShell encoding
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\_system\start\encoding_fix.ps1

      - name: V4-B planner smoke
        shell: powershell
        run: |
          & .\_system\tests\v4b_planner_smoke.ps1

      - name: V4-B source selection smoke
        shell: powershell
        run: |
          & .\_system\tests\v4b_source_conflict_smoke.ps1

      - name: TinySnow 580 detail4 R5 only
        shell: powershell
        env:
          TINYSNOW_API_KEY: ${{ secrets.TINYSNOW_API_KEY }}
        run: |
          & .\_system\tests\v4b_live_580_r5.ps1

      - name: Upload V4-B 580 R5 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow-V4-B-580-R5
          path: _system/live_e2e_output_v4b_580_r5/
          if-no-files-found: ignore
