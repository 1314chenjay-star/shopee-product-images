name: V4-C5.3 Delta Recovery Bridge

on:
  workflow_call:
  push:
    branches: [v4c-universal-product-engine]
    paths:
      - '_system/control/TRIGGER_C5_3_DELTA_RECOVERY_BRIDGE'

permissions:
  contents: write

concurrency:
  group: tinysnow-c5-3-delta-recovery-bridge
  cancel-in-progress: false

jobs:
  recover-first-pending-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4c-universal-product-engine
          fetch-depth: 0

      - name: Determine whether delta recovery is required
        id: state
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          cp=json.load(open('_system/control/execution_checkpoint.json',encoding='utf-8-sig'))
          q=[json.loads(x) for x in open('_system/agent_queue/queue.jsonl',encoding='utf-8-sig') if x.strip()]
          t=next(x for x in q if x['task_id']=='TASK-C5-3-SOURCE-TRUTH-REPAIR')
          should=(cp.get('checkpoint')=='DELTA_SCOPE_OVERLAY' and cp.get('pending',[None])[0]=='145/549 delta scope overlay' and t.get('checkpoint')=='DELTA_SCOPE_OVERLAY')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write('should_run='+('true' if should else 'false')+'\n')
          print({'checkpoint':cp.get('checkpoint'),'queue_checkpoint':t.get('checkpoint'),'should_run':should})
          PY

      - name: Guard stable and safety boundary
        if: steps.state.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          STABLE=$(git ls-remote origin refs/heads/tinysnow-tool-only | awk '{print $1}')
          test "$STABLE" = "5d49f061e140813b3d229520e9e530f86b27b640"
          python - <<'PY'
          import json
          q=[json.loads(x) for x in open('_system/agent_queue/queue.jsonl',encoding='utf-8-sig') if x.strip()]
          t=next(x for x in q if x['task_id']=='TASK-C5-3-SOURCE-TRUTH-REPAIR')
          assert not t['paid'] and not t['generation'] and not t['owner_decision_required']
          PY

      - name: Run authoritative overlay with durable diagnostics
        id: overlay
        if: steps.state.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, textwrap, traceback, datetime as dt
          diag_path=Path('_system/control/c5_3_delta_recovery_diagnostic.json')
          queue_path=Path('_system/v4c/generation_plan/generation_plan_queue.jsonl')
          ready_path=Path('_system/v4c/generation_payload/execution_ready_queue.jsonl')
          readiness_path=Path('_system/v4c/generation_payload/product_execution_readiness.jsonl')
          cov=json.loads(Path('_system/v4c/generation_payload/coverage_summary.json').read_text(encoding='utf-8-sig'))
          actual_queue_sha=hashlib.sha256(queue_path.read_bytes()).hexdigest()
          expected_queue_sha=cov.get('frozen_fingerprints',{}).get('generation_plan_queue_sha256')
          frozen={
            'expected_generation_plan_queue_sha256':expected_queue_sha,
            'actual_generation_plan_queue_sha256':actual_queue_sha,
            'generation_plan_queue_sha_match':actual_queue_sha==expected_queue_sha,
            'coverage_ready_products':cov.get('final_paid_execution_candidate_products'),
            'coverage_ready_slots':cov.get('final_paid_execution_candidate_slots'),
            'execution_ready_queue_rows':sum(1 for x in ready_path.read_text(encoding='utf-8-sig').splitlines() if x.strip()),
            'product_readiness_ready_rows':sum(1 for x in readiness_path.read_text(encoding='utf-8-sig').splitlines() if x.strip() and json.loads(x).get('status')=='PRODUCT_READY_FOR_GENERATION')
          }
          result='FAIL'
          try:
              src=Path('.github/workflows/v4c-c5-3-delta-scope-overlay.yml').read_text(encoding='utf-8')
              marker="          python - <<'PY'\n"
              start=src.index(marker)+len(marker)
              end=src.index("\n          PY",start)
              code=textwrap.dedent(src[start:end])
              exec(compile(code,'v4c-c5-3-delta-scope-overlay.yml','exec'),{'__name__':'__main__'})
              result='PASS'
              diag={'schema_version':'tinysnow.c5.3.delta-recovery-diagnostic.1','status':'PASS','timestamp_utc':dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z'),'frozen_input_check':frozen,'error':None}
          except BaseException as e:
              diag={'schema_version':'tinysnow.c5.3.delta-recovery-diagnostic.1','status':'FAIL','timestamp_utc':dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z'),'frozen_input_check':frozen,'error_type':type(e).__name__,'error':str(e),'traceback':traceback.format_exc()}
          diag_path.write_text(json.dumps(diag,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write('result='+result+'\n')
          print(json.dumps(diag,ensure_ascii=False))
          PY

      - name: Synchronize queue with advanced checkpoint
        if: steps.overlay.outputs.result == 'PASS'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          cp=json.load(open('_system/control/execution_checkpoint.json',encoding='utf-8-sig'))
          assert cp['checkpoint']=='C5_3_REGRESSION'
          p=pathlib.Path('_system/agent_queue/queue.jsonl')
          rows=[json.loads(x) for x in p.read_text(encoding='utf-8-sig').splitlines() if x.strip()]
          for t in rows:
              if t.get('task_id')=='TASK-C5-3-SOURCE-TRUTH-REPAIR':
                  t['checkpoint']='C5_3_REGRESSION'
                  t['next_action']='C5.3-only regressions'
                  t['next_workflow']='v4c-c5-3-scoped-regression.yml'
                  t['status']='RECOVERING'
          p.write_text(''.join(json.dumps(x,ensure_ascii=False,separators=(',',':'))+'\n' for x in rows),encoding='utf-8')
          PY

      - name: Persist durable overlay evidence
        if: steps.overlay.outputs.result == 'PASS'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TinySnow Delta Recovery Worker"
          git config user.email "actions@users.noreply.github.com"
          git add _system/v4c/source_truth_bootstrap _system/control/execution_checkpoint.json _system/control/live_status.json _system/control/worker_state.json _system/control/c5_3_delta_recovery_diagnostic.json _system/agent_queue/queue.jsonl
          git commit -m "v4c5.3: recover 145 ready products and 549 slots [skip ci]"
          git push origin HEAD:v4c-universal-product-engine

      - name: Persist failure diagnostic without partial overlay state
        if: steps.state.outputs.should_run == 'true' && steps.overlay.outputs.result == 'FAIL'
        shell: bash
        run: |
          set -euo pipefail
          cp _system/control/c5_3_delta_recovery_diagnostic.json /tmp/c5_3_delta_recovery_diagnostic.json
          git reset --hard HEAD
          git clean -fd _system/v4c/source_truth_bootstrap || true
          cp /tmp/c5_3_delta_recovery_diagnostic.json _system/control/c5_3_delta_recovery_diagnostic.json
          git config user.name "TinySnow Delta Recovery Worker"
          git config user.email "actions@users.noreply.github.com"
          git add _system/control/c5_3_delta_recovery_diagnostic.json
          git commit -m "control: persist C5.3 delta recovery failure diagnostic [skip ci]"
          git push origin HEAD:v4c-universal-product-engine
