name: V4-A.3 TinySnow 580 Detail2

on:
  push:
    branches:
      - v4a3-five-image-planner

jobs:
  live580d2:
    if: github.event.head_commit.message == 'RUN-V4A3-LIVE-580-D2'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Normalize PowerShell encoding
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\_system\start\encoding_fix.ps1

      - name: V4-A.3 focused static smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a3_five_image_planner_smoke.ps1

      - name: TinySnow 580 detail2 only
        shell: powershell
        env:
          TINYSNOW_API_KEY: ${{ secrets.TINYSNOW_API_KEY }}
        run: |
          & .\_system\tests\v4a3_live_580_detail2.ps1

      - name: Upload 580 detail2 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow-V4-A.3-580-Detail2-Live
          path: _system/live_e2e_output_v4a3_580_d2/
          if-no-files-found: ignore
