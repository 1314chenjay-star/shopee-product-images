name: V4-C4.0 Preservation-Aware 5-Slot Generation Planner

on:
  push:
    branches: [v4c-universal-product-engine]
    paths:
      - '_system/tests/v4c_generation_plan.py'
      - '.github/workflows/v4c-generation-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_HEAD: 611e78576ab64a1cca088be6041bf4885716eac5
  STABLE_HEAD: 5d49f061e140813b3d229520e9e530f86b27b640
  OUT: _system/v4c/generation_plan

jobs:
  planner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen baseline and stable HEAD
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git merge-base --is-ancestor $env:BASE_HEAD HEAD
          if($LASTEXITCODE -ne 0){ throw 'Current HEAD is not descended from sealed V4-C3.2 HEAD.' }
          $stable=(git ls-remote origin refs/heads/tinysnow-tool-only).Split("`t")[0].Trim()
          if($stable -ne $env:STABLE_HEAD){ throw "Stable HEAD changed: $stable" }
          $changed=@(git diff --name-only "$env:BASE_HEAD..HEAD")
          $allowed=@('_system/tests/v4c_generation_plan.py','.github/workflows/v4c-generation-plan.yml')
          foreach($p in $changed){ if($allowed -notcontains $p){ throw "Unexpected pre-plan change since frozen V4-C3.2: $p" } }
          git diff --quiet $env:BASE_HEAD -- _system/start/api_v2.ps1
          if($LASTEXITCODE -ne 0){ throw '_system/start/api_v2.ps1 changed.' }
          Write-Host "BASE_HEAD=$env:BASE_HEAD"
          Write-Host "STABLE_HEAD=$stable"

      - name: Compile new planner only
        shell: pwsh
        run: |
          python -m py_compile _system/tests/v4c_generation_plan.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Build global canonical base state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path $env:OUT | Out-Null
          python _system/tests/v4c_generation_plan.py prepare `
            --inventory _system/v4c/inventory/source_inventory.jsonl `
            --progress _system/v4c/progress/v4c_source_progress.jsonl `
            --duplicates _system/v4c/results/duplicate_map.json `
            --closeout _system/v4c/closeout/canonical_ledger.jsonl `
            --corrected-images _system/v4c/factual_gate/correction_v4c3_2/corrected_image_gate.jsonl `
            --corrected-queue _system/v4c/factual_gate/correction_v4c3_2/corrected_generation_queue.jsonl `
            --c32-summary _system/v4c/factual_gate/correction_v4c3_2/summary.json `
            --base-state "$env:OUT/canonical_image_state_base.jsonl" `
            --prepare-summary "$env:OUT/prepare_summary.json"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Run 25-product representative Canary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python _system/tests/v4c_generation_plan.py canary `
            --base-state "$env:OUT/canonical_image_state_base.jsonl" `
            --canary-size 25 `
            --canary-manifest "$env:OUT/canary_manifest.jsonl" `
            --canary-plan "$env:OUT/canary_product_5slot_plan.jsonl" `
            --canary-validation "$env:OUT/canary_validation.json"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Build full 375-product canonical five-slot plan after Canary PASS
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python _system/tests/v4c_generation_plan.py full `
            --base-state "$env:OUT/canonical_image_state_base.jsonl" `
            --prepare-summary "$env:OUT/prepare_summary.json" `
            --canary-validation "$env:OUT/canary_validation.json" `
            --canonical-state "$env:OUT/canonical_image_state.jsonl" `
            --product-plan "$env:OUT/product_5slot_plan.jsonl" `
            --preserve-manifest "$env:OUT/preserve_manifest.jsonl" `
            --generation-queue "$env:OUT/generation_plan_queue.jsonl" `
            --hold-block-manifest "$env:OUT/hold_block_manifest.jsonl" `
            --coverage-summary "$env:OUT/coverage_summary.json" `
            --validation "$env:OUT/validation.json" `
            --lock "$env:OUT/V4_C4_0_GENERATION_PLAN_LOCK.json" `
            --workflow-run "$env:GITHUB_RUN_ID" `
            --stable-head "$env:STABLE_HEAD"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Final safety and frozen-state reconciliation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $v=Get-Content "$env:OUT/validation.json" -Raw | ConvertFrom-Json
          if(-not [bool]$v.passed){ throw 'V4-C4.0 validation not PASS.' }
          foreach($k in @('unknown_leak','conflict_leak','forbidden_leak','block_factual_selected','duplicate_slot_assignment','locked_product_regeneration_count')){
            if([int]$v.$k -ne 0){ throw "Safety metric nonzero: $k=$($v.$k)" }
          }
          if([bool]$v.generation_executed){ throw 'Generation executed unexpectedly.' }
          foreach($prop in $v.api_flags.PSObject.Properties){ if([bool]$prop.Value){ throw "Forbidden flag true: $($prop.Name)" } }
          $stable=(git ls-remote origin refs/heads/tinysnow-tool-only).Split("`t")[0].Trim()
          if($stable -ne $env:STABLE_HEAD){ throw 'Stable changed during planner.' }
          git diff --quiet $env:BASE_HEAD -- _system/start/api_v2.ps1
          if($LASTEXITCODE -ne 0){ throw 'api_v2.ps1 changed during planner.' }
          git diff --quiet $env:BASE_HEAD -- _system/v4c/closeout _system/v4c/factual_gate _system/v4c/preservation _system/v4c/inventory _system/v4c/progress _system/v4c/results
          if($LASTEXITCODE -ne 0){ throw 'A frozen V4-C input path changed.' }

      - name: Persist V4-C4.0 generation plan only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _system/v4c/generation_plan
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){ throw 'No V4-C4.0 outputs were staged.' }
          $staged=@(git diff --cached --name-only)
          foreach($p in $staged){ if(-not $p.StartsWith('_system/v4c/generation_plan/')){ throw "Unexpected staged file: $p" } }
          git commit -m 'V4-C4.0 persist canonical five-slot generation plan [skip ci]'
          git push origin HEAD:v4c-universal-product-engine
