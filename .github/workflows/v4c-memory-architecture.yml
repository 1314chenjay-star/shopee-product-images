name: V4-C4.2 Persistent Memory + Identity-First Resolver Architecture

on:
  push:
    branches: [v4c-universal-product-engine]
    paths:
      - '_system/tests/v4c_memory_architecture.py'
      - '_system/tests/v4c_memory_architecture_r2.py'
      - '_system/tests/v4c_memory_identity_resolver.py'
      - '_system/memory/memory_runtime.py'
      - '_system/memory/memory_cli.ps1'
      - '.github/workflows/v4c-memory-architecture.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_HEAD: b064b8a022e29eec6eeaeb1e5561b25d5abda9e9
  STABLE_HEAD: 5d49f061e140813b3d229520e9e530f86b27b640
  OUT: _system/memory

jobs:
  memory-architecture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize V4-C4.2 runtime paths
        shell: pwsh
        run: |
          $tempMemory=Join-Path $env:RUNNER_TEMP 'v4c42_canary_memory'
          $bootstrapCanary=Join-Path $env:RUNNER_TEMP 'v4c42_bootstrap_canary.json'
          $identityCanary=Join-Path $env:RUNNER_TEMP 'v4c42_identity_canary.json'
          $performanceCanary=Join-Path $env:RUNNER_TEMP 'v4c42_performance_canary.json'
          "TEMP_MEMORY=$tempMemory" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOTSTRAP_CANARY=$bootstrapCanary" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "IDENTITY_CANARY=$identityCanary" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PERFORMANCE_CANARY=$performanceCanary" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify sealed V4-C4.1 baseline and stable HEAD
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git merge-base --is-ancestor $env:BASE_HEAD HEAD
          if($LASTEXITCODE -ne 0){ throw 'Current HEAD is not descended from sealed V4-C4.1 HEAD.' }
          $stable=(git ls-remote origin refs/heads/tinysnow-tool-only).Split("`t")[0].Trim()
          if($stable -ne $env:STABLE_HEAD){ throw "Stable HEAD changed: $stable" }
          git diff --quiet $env:BASE_HEAD -- _system/v4c _system/start/api_v2.ps1
          if($LASTEXITCODE -ne 0){ throw 'Frozen V4-C1 through V4-C4.1 data or api_v2.ps1 changed.' }
          $changed=@(git diff --name-only "$env:BASE_HEAD..HEAD")
          foreach($p in $changed){
            $ok=$p.StartsWith('_system/memory/') -or $p -eq '_system/tests/v4c_memory_architecture.py' -or $p -eq '_system/tests/v4c_memory_architecture_r2.py' -or $p -eq '_system/tests/v4c_memory_identity_resolver.py' -or $p -eq '.github/workflows/v4c-memory-architecture.yml'
            if(-not $ok){ throw "Unexpected V4-C4.2 change: $p" }
          }

      - name: Compile memory, resolver, runtime and PowerShell 5.1 bridge
        shell: pwsh
        run: |
          python -m py_compile _system/tests/v4c_memory_architecture.py _system/tests/v4c_memory_architecture_r2.py _system/tests/v4c_memory_identity_resolver.py _system/memory/memory_runtime.py
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          powershell.exe -NoProfile -Command "$null=[scriptblock]::Create((Get-Content '_system/memory/memory_cli.ps1' -Raw)); Write-Host 'PS5.1_PARSE_PASS'"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Pre-bootstrap multi-category safety Canary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python _system/tests/v4c_memory_architecture_r2.py canary --output "$env:BOOTSTRAP_CANARY" --stable-head "$env:STABLE_HEAD"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $c=Get-Content "$env:BOOTSTRAP_CANARY" -Raw | ConvertFrom-Json
          if(-not [bool]$c.passed){ throw 'Pre-bootstrap Memory Canary failed.' }
          foreach($k in @('unknown_reusable_count','conflict_reusable_count','forbidden_reusable_count','hold_block_upgraded','locked_product_overwrite')){ if([int]$c.$k -ne 0){ throw "Pre-bootstrap safety metric nonzero: $k" } }
          foreach($prop in $c.api_flags.PSObject.Properties){ if([bool]$prop.Value){ throw "Forbidden pre-bootstrap flag true: $($prop.Name)" } }

      - name: Build temporary approved bootstrap for Identity-First Canary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path "$env:TEMP_MEMORY" | Out-Null
          python _system/tests/v4c_memory_architecture_r2.py bootstrap --out "$env:TEMP_MEMORY" --canary-validation "$env:BOOTSTRAP_CANARY" --stable-head "$env:STABLE_HEAD" --workflow-run "$env:GITHUB_RUN_ID"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python _system/tests/v4c_memory_identity_resolver.py upgrade --memory-dir "$env:TEMP_MEMORY"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Identity-First Resolver and GenerationContext Canary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python _system/tests/v4c_memory_identity_resolver.py canary --memory-dir "$env:TEMP_MEMORY" --output "$env:IDENTITY_CANARY"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $c=Get-Content "$env:IDENTITY_CANARY" -Raw | ConvertFrom-Json
          if(-not [bool]$c.passed){ throw 'Identity-First Canary failed.' }
          foreach($k in @('unknown_reusable','conflict_reusable','forbidden_reusable','hold_block_upgrade','locked_mutation','identity_mismatch_reuse','variant_cross_contamination','rejected_output_active_reuse','superseded_output_active_reuse','revoked_fact_active_reuse','category_fact_contamination','template_fact_contamination')){ if([int]$c.$k -ne 0){ throw "Identity Canary metric nonzero: $k=$($c.$k)" } }
          foreach($k in @('approved_only_output_reuse','verified_only_fact_reuse','exact_sha_safe_lookup','context_package_validation','anti_cross_product_guard','incremental_append','regression_lookup','sqlite_integrity_check')){ if(-not [bool]$c.$k){ throw "Identity Canary contract failed: $k" } }
          foreach($prop in $c.api_flags.PSObject.Properties){ if([bool]$prop.Value){ throw "Forbidden identity Canary flag true: $($prop.Name)" } }

      - name: Performance and crash-safety Canary 1k to 10k products
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python _system/tests/v4c_memory_identity_resolver.py performance --output "$env:PERFORMANCE_CANARY"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $p=Get-Content "$env:PERFORMANCE_CANARY" -Raw | ConvertFrom-Json
          if(-not [bool]$p.passed){ throw 'Performance Canary failed.' }
          foreach($k in @('startup_requires_jsonl_parse','single_product_lookup_full_table_scan','incremental_insert_rebuilt_database')){ if([bool]$p.$k){ throw "Performance anti-pattern detected: $k" } }
          foreach($k in @('exact_sha_lookup_uses_index','product_lookup_uses_index','memory_usage_bounded','crash_rollback_pass','duplicate_write_protection_pass','sqlite_integrity_pass','journal_mode_wal')){ if(-not [bool]$p.$k){ throw "Performance contract failed: $k" } }
          foreach($prop in $p.api_flags.PSObject.Properties){ if([bool]$prop.Value){ throw "Forbidden performance flag true: $($prop.Name)" } }

      - name: Build final approved bootstrap after all Canaries PASS
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python _system/tests/v4c_memory_architecture_r2.py bootstrap --out "$env:OUT" --canary-validation "$env:BOOTSTRAP_CANARY" --stable-head "$env:STABLE_HEAD" --workflow-run "$env:GITHUB_RUN_ID"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          python _system/tests/v4c_memory_identity_resolver.py upgrade --memory-dir "$env:OUT"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Copy-Item "$env:BOOTSTRAP_CANARY" "$env:OUT/memory_bootstrap_canary_validation.json" -Force
          Copy-Item "$env:IDENTITY_CANARY" "$env:OUT/memory_identity_canary_validation.json" -Force
          Copy-Item "$env:PERFORMANCE_CANARY" "$env:OUT/memory_performance_canary_validation.json" -Force

      - name: Final integrity, context, SQLite and JSONL reconciliation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python _system/tests/v4c_memory_identity_resolver.py validate --memory-dir "$env:OUT" --canary "$env:IDENTITY_CANARY" --performance "$env:PERFORMANCE_CANARY" --stable-head "$env:STABLE_HEAD" --workflow-run "$env:GITHUB_RUN_ID"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $v=Get-Content "$env:OUT/memory_validation.json" -Raw | ConvertFrom-Json
          if(-not [bool]$v.passed){ throw 'Final memory validation not PASS.' }
          foreach($k in @('unknown_reusable','conflict_reusable','forbidden_reusable','hold_block_upgraded','cross_product_leakage','variant_leakage','memory_identity_conflict_count','locked_mutations')){ if([int]$v.$k -ne 0){ throw "Final safety metric nonzero: $k=$($v.$k)" } }
          foreach($k in @('exact_match_reuse_pass','identity_mismatch_rejection_pass','context_validation_pass','anti_cross_product_guard_pass','category_risk_separation_pass','template_fact_separation_pass','incremental_lookup_pass','performance_canary_pass','crash_recovery_pass','sqlite_integrity_pass','jsonl_sqlite_reconciliation_pass')){ if(-not [bool]$v.$k){ throw "Final contract failed: $k" } }
          if([bool]$v.generation_executed){ throw 'Generation executed during V4-C4.2.' }
          foreach($prop in $v.api_flags.PSObject.Properties){ if([bool]$prop.Value){ throw "Forbidden final flag true: $($prop.Name)" } }
          $stable=(git ls-remote origin refs/heads/tinysnow-tool-only).Split("`t")[0].Trim()
          if($stable -ne $env:STABLE_HEAD){ throw 'Stable HEAD changed during V4-C4.2.' }
          git diff --quiet $env:BASE_HEAD -- _system/v4c _system/start/api_v2.ps1
          if($LASTEXITCODE -ne 0){ throw 'Frozen prior-stage data changed during V4-C4.2.' }

      - name: Persist final V4-C4.2 memory architecture only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _system/memory
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){ throw 'No final V4-C4.2 memory changes staged.' }
          $staged=@(git diff --cached --name-only)
          foreach($p in $staged){ if(-not $p.StartsWith('_system/memory/')){ throw "Unexpected staged file: $p" } }
          git commit -m 'V4-C4.2 persist identity-first persistent memory architecture [skip ci]'
          git push origin HEAD:v4c-universal-product-engine
