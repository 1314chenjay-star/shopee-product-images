name: V4-C2.5 Artifact-Miss Targeted Source Fallback

on:
  workflow_dispatch:
  push:
    branches:
      - v4c-universal-product-engine
    paths:
      - ".github/workflows/v4c-source-fallback.yml"
      - "_system/tests/v4c_source_fallback.py"
      - "_system/tests/v4c_source_fallback_validate.py"

permissions:
  contents: write

concurrency:
  group: v4c2-5-targeted-source-fallback
  cancel-in-progress: true

env:
  BASE_HEAD: 0bc5a97d0428ecccfcebcc42c35a85e12d3cbe91
  STABLE_HEAD: 5d49f061e140813b3d229520e9e530f86b27b640
  BARTIFACT_EVIDENCE: _system/v4c/evidence_hydration/bartifact_recovery/materialized_evidence.jsonl
  PRODUCT_CONTEXT: _system/v4c/semantic/bootstrap/product_context.jsonl.gz.b64
  REQUIREMENTS: _system/v4c/preservation/requirements.txt
  DURABLE_PATH: _system/v4c/evidence_hydration/source_fallback/evidence.jsonl

jobs:
  plan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify V4-C1 through V4-C2.4 remain frozen
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor $env:BASE_HEAD HEAD
          if ($LASTEXITCODE -ne 0) { throw 'HEAD is not descended from frozen V4-C2.4 HEAD' }
          $stableLine = git ls-remote origin refs/heads/tinysnow-tool-only
          $stableHead = ($stableLine -split '\s+')[0]
          if ($stableHead -ne $env:STABLE_HEAD) { throw "Stable HEAD changed: $stableHead" }
          $frozen = @(
            '_system/v4c/inventory',
            '_system/v4c/progress',
            '_system/v4c/results',
            '_system/v4c/preservation',
            '_system/v4c/semantic/preservation',
            '_system/v4c/claim_gate',
            '_system/v4c/progressive_claim',
            '_system/v4c/evidence_hydration/EVIDENCE_HYDRATION_LOCK.json',
            '_system/v4c/evidence_hydration/canary_validation.json',
            '_system/v4c/evidence_hydration/evidence_gap_index.jsonl',
            '_system/v4c/evidence_hydration/gap_summary.json',
            '_system/v4c/evidence_hydration/evidence.jsonl',
            '_system/v4c/evidence_hydration/validation.json',
            '_system/v4c/evidence_hydration/bartifact_recovery',
            '_system/tests/v4c_hold_hydration.py',
            '_system/tests/v4c_hold_hydration_validate.py',
            '_system/tests/v4c_claim_level_gate.py',
            '_system/tests/v4c_bartifact_recovery.py',
            '_system/tests/v4c_bartifact_recovery_validate.py',
            '.github/workflows/v4c-hold-evidence-hydration.yml',
            '.github/workflows/v4c-hold-evidence-hydration-resume.yml',
            '.github/workflows/v4c-bartifact-materialization-recovery.yml',
            '_system/start/api_v2.ps1'
          )
          git diff --quiet $env:BASE_HEAD -- $frozen
          if ($LASTEXITCODE -ne 0) { throw 'A frozen successful-stage file changed' }
          Write-Host 'RERUN_1378=false'
          Write-Host 'SOURCE_REFETCH_1144=false'
          Write-Host 'COMPLETED_OCR_RERUN=false'
          Write-Host 'SEMANTIC_RERUN=false'
          Write-Host 'INVENTORY_REBUILT=false'
          Write-Host 'OLD_GATE_MODIFIED=false'
          Write-Host 'ORIGINAL_13_BLOCK_TOUCHED=false'

      - name: Compile and self-test only V4-C2.5 modules
        shell: powershell
        run: |
          python -m py_compile _system\tests\v4c_source_fallback.py _system\tests\v4c_source_fallback_validate.py
          python _system\tests\v4c_source_fallback.py self-test

      - name: Build exact 187 target and 40 targeted-fetch canary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts\plan | Out-Null
          python _system\tests\v4c_source_fallback.py plan `
            --bartifact-evidence $env:BARTIFACT_EVIDENCE `
            --target-out artifacts\plan\target_187.jsonl `
            --fallback-out artifacts\plan\fallback_184.jsonl `
            --found-hold-out artifacts\plan\found_hold_3.jsonl `
            --canary-out artifacts\plan\canary_40.jsonl `
            --remaining-out artifacts\plan\remaining_144.jsonl `
            --summary artifacts\plan\plan_summary.json `
            --canary-size 40

      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-5-source-fallback-plan
          path: artifacts/plan
          if-no-files-found: error
          retention-days: 14

  resolve_found_hold:
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-5-source-fallback-plan
          path: artifacts/plan
      - name: Resolve 3 artifact-found HOLD from existing durable evidence only
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts\found | Out-Null
          python _system\tests\v4c_source_fallback.py resolve-found `
            --manifest artifacts\plan\found_hold_3.jsonl `
            --output artifacts\found\resolution.jsonl `
            --summary artifacts\found\summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-5-found-hold-resolution
          path: artifacts/found
          if-no-files-found: error
          retention-days: 14

  canary:
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-5-source-fallback-plan
          path: artifacts/plan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ env.REQUIREMENTS }}
      - name: Install unchanged free local OCR dependencies
        shell: powershell
        run: python -m pip install --disable-pip-version-check -r $env:REQUIREMENTS

      - name: Canary checkpoint seed first 10 targeted source fetches
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts\canary | Out-Null
          python _system\tests\v4c_source_fallback.py process `
            --manifest artifacts\plan\canary_40.jsonl `
            --product-context $env:PRODUCT_CONTEXT `
            --progress artifacts\canary\progress.jsonl `
            --summary artifacts\canary\seed_summary.json `
            --cache-dir "$env:RUNNER_TEMP\v4c25-canary-cache" `
            --evidence-repo-path $env:DURABLE_PATH `
            --max-items 10

      - name: Resume same canary checkpoint to 40
        shell: powershell
        run: |
          python _system\tests\v4c_source_fallback.py process `
            --manifest artifacts\plan\canary_40.jsonl `
            --product-context $env:PRODUCT_CONTEXT `
            --progress artifacts\canary\progress.jsonl `
            --summary artifacts\canary\resume_summary.json `
            --cache-dir "$env:RUNNER_TEMP\v4c25-canary-cache" `
            --evidence-repo-path $env:DURABLE_PATH

      - name: Validate only new 40-record targeted fallback canary
        shell: powershell
        run: |
          python _system\tests\v4c_source_fallback_validate.py `
            --phase CANARY `
            --manifest artifacts\plan\canary_40.jsonl `
            --evidence artifacts\canary\progress.jsonl `
            --seed-summary artifacts\canary\seed_summary.json `
            --resume-summary artifacts\canary\resume_summary.json `
            --output artifacts\canary\validation.json

      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-5-source-fallback-canary
          path: artifacts/canary
          if-no-files-found: error
          retention-days: 14

  full:
    needs: [plan, canary]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-5-source-fallback-plan
          path: artifacts/plan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ env.REQUIREMENTS }}
      - name: Install unchanged free local OCR dependencies
        shell: powershell
        run: python -m pip install --disable-pip-version-check -r $env:REQUIREMENTS

      - name: Seed remaining fallback checkpoint with first 50
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts\full | Out-Null
          python _system\tests\v4c_source_fallback.py process `
            --manifest artifacts\plan\remaining_144.jsonl `
            --product-context $env:PRODUCT_CONTEXT `
            --progress artifacts\full\progress.jsonl `
            --summary artifacts\full\seed_summary.json `
            --cache-dir "$env:RUNNER_TEMP\v4c25-full-cache" `
            --evidence-repo-path $env:DURABLE_PATH `
            --max-items 50

      - name: Resume and finish remaining 144 after canary PASS
        shell: powershell
        run: |
          python _system\tests\v4c_source_fallback.py process `
            --manifest artifacts\plan\remaining_144.jsonl `
            --product-context $env:PRODUCT_CONTEXT `
            --progress artifacts\full\progress.jsonl `
            --summary artifacts\full\resume_summary.json `
            --cache-dir "$env:RUNNER_TEMP\v4c25-full-cache" `
            --evidence-repo-path $env:DURABLE_PATH
          $resume = Get-Content artifacts\full\resume_summary.json -Raw | ConvertFrom-Json
          if ([int]$resume.checkpoint_existing_terminal -lt 50) { throw 'Full fallback checkpoint did not resume from first 50' }
          if ([int]$resume.covered_after_run -ne 144) { throw 'Full fallback did not cover remaining 144' }

      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-5-source-fallback-full
          path: artifacts/full
          if-no-files-found: error
          retention-days: 14

  aggregate_and_persist:
    needs: [plan, resolve_found_hold, canary, full]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-5-source-fallback-plan
          path: artifacts/plan
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-5-found-hold-resolution
          path: artifacts/found
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-5-source-fallback-canary
          path: artifacts/canary
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-5-source-fallback-full
          path: artifacts/full

      - name: Aggregate exactly 187 V4-C2.5 records
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts\final | Out-Null
          python _system\tests\v4c_source_fallback.py aggregate `
            --target-manifest artifacts\plan\target_187.jsonl `
            --found-resolution artifacts\found\resolution.jsonl `
            --canary-progress artifacts\canary\progress.jsonl `
            --full-progress artifacts\full\progress.jsonl `
            --output artifacts\final\evidence.jsonl `
            --summary artifacts\final\summary.json

      - name: Final V4-C2.5 reconciliation and safety validation
        shell: powershell
        run: |
          python _system\tests\v4c_source_fallback_validate.py `
            --phase FINAL `
            --manifest artifacts\plan\target_187.jsonl `
            --evidence artifacts\final\evidence.jsonl `
            --output artifacts\final\validation.json

      - name: Recheck stable and all frozen prior stages before persistence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stableLine = git ls-remote origin refs/heads/tinysnow-tool-only
          $stableHead = ($stableLine -split '\s+')[0]
          if ($stableHead -ne $env:STABLE_HEAD) { throw "Stable HEAD changed: $stableHead" }
          $frozen = @(
            '_system/v4c/inventory','_system/v4c/progress','_system/v4c/results','_system/v4c/preservation','_system/v4c/semantic/preservation','_system/v4c/claim_gate','_system/v4c/progressive_claim',
            '_system/v4c/evidence_hydration/EVIDENCE_HYDRATION_LOCK.json','_system/v4c/evidence_hydration/canary_validation.json','_system/v4c/evidence_hydration/evidence_gap_index.jsonl','_system/v4c/evidence_hydration/gap_summary.json','_system/v4c/evidence_hydration/evidence.jsonl','_system/v4c/evidence_hydration/validation.json','_system/v4c/evidence_hydration/bartifact_recovery',
            '_system/tests/v4c_hold_hydration.py','_system/tests/v4c_hold_hydration_validate.py','_system/tests/v4c_claim_level_gate.py','_system/tests/v4c_bartifact_recovery.py','_system/tests/v4c_bartifact_recovery_validate.py',
            '.github/workflows/v4c-hold-evidence-hydration.yml','.github/workflows/v4c-hold-evidence-hydration-resume.yml','.github/workflows/v4c-bartifact-materialization-recovery.yml','_system/start/api_v2.ps1'
          )
          git diff --quiet $env:BASE_HEAD -- $frozen
          if ($LASTEXITCODE -ne 0) { throw 'Frozen prior-stage file changed during V4-C2.5' }
          Write-Host "STABLE_HEAD=$stableHead"

      - name: Build V4-C2.5 lock and persist only new fallback evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = '_system\v4c\evidence_hydration\source_fallback'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item artifacts\plan\target_187.jsonl "$dst\target_187.jsonl" -Force
          Copy-Item artifacts\plan\fallback_184.jsonl "$dst\fallback_184.jsonl" -Force
          Copy-Item artifacts\plan\plan_summary.json "$dst\plan_summary.json" -Force
          Copy-Item artifacts\found\resolution.jsonl "$dst\found_hold_resolution.jsonl" -Force
          Copy-Item artifacts\found\summary.json "$dst\found_hold_summary.json" -Force
          Copy-Item artifacts\canary\validation.json "$dst\canary_validation.json" -Force
          Copy-Item artifacts\final\evidence.jsonl "$dst\evidence.jsonl" -Force
          Copy-Item artifacts\final\summary.json "$dst\summary.json" -Force
          Copy-Item artifacts\final\validation.json "$dst\validation.json" -Force
          $s = Get-Content artifacts\final\summary.json -Raw | ConvertFrom-Json
          $lock = [ordered]@{
            schema_version = 'v4c2.5.source-fallback-lock.1'
            passed = $true
            workflow_run = "$env:GITHUB_RUN_ID"
            base_head = $env:BASE_HEAD
            stable_head = $env:STABLE_HEAD
            target = [int]$s.target
            targeted_source_fetch_planned = [int]$s.targeted_source_fetch_planned
            fetch_success = [int]$s.fetch_success
            fetch_failed = [int]$s.fetch_failed
            sha_matched = [int]$s.sha_matched
            sha_mismatch = [int]$s.sha_mismatch
            preserve = [int]$s.preserve
            needs_localization = [int]$s.needs_localization
            partial_safe = [int]$s.partial_safe
            hold_remaining = [int]$s.hold_remaining
            block_source_changed = [int]$s.block_source_changed
            found_hold_target = [int]$s.found_hold_resolution.target
            found_hold_upgraded_partial_safe = [int]$s.found_hold_resolution.upgraded_partial_safe
            found_hold_retained = [int]$s.found_hold_resolution.retained_hold
            targeted_source_fetch_called = $true
            artifact_search_called = $false
            artifact_download_called = $false
            completed_ocr_rerun = $false
            semantic_inference_executed = $false
            completed_semantic_rerun = $false
            image_generation_called = $false
            tiny_snow_api_called = $false
            paid_api_called = $false
            vision_api_called = $false
            rerun_1378 = $false
            source_refetch_1144 = $false
            inventory_rebuilt = $false
            old_gate_modified = $false
            original_13_block_touched = $false
          }
          $lock | ConvertTo-Json -Depth 20 | Set-Content "$dst\SOURCE_FALLBACK_LOCK.json" -Encoding UTF8
          git config user.name 'TinySnow V4-C2.5 Source Fallback'
          git config user.email 'actions@users.noreply.github.com'
          git add _system/v4c/evidence_hydration/source_fallback
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'V4-C2.5 persist targeted source fallback evidence [skip ci]'
            git push origin HEAD:v4c-universal-product-engine
          }

      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-5-source-fallback-final
          path: artifacts/final
          if-no-files-found: error
          retention-days: 30
