name: V4-C2.3 HOLD Evidence Hydration Resume

on:
  workflow_dispatch:
  push:
    branches:
      - v4c-universal-product-engine
    paths:
      - ".github/workflows/v4c-hold-evidence-hydration-resume.yml"
      - "_system/tests/v4c_hold_hydration_pathfix.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: v4c2-3-hold-evidence-hydration-resume
  cancel-in-progress: false

env:
  BASE_HEAD: c59435e9b1378e91f0feaf4c55d83ef0f54e0b05
  PLAN_RUN_ID: '31951124712'
  STABLE_HEAD: 5d49f061e140813b3d229520e9e530f86b27b640
  SEMANTIC_EVIDENCE: _system/v4c/semantic/preservation/semantic_evidence.jsonl
  PRESERVATION_EVIDENCE: _system/v4c/preservation/results/image_preservation.jsonl
  PRODUCT_CONTEXT: _system/v4c/semantic/bootstrap/product_context.jsonl.gz.b64
  REQUIREMENTS: _system/v4c/preservation/requirements.txt

jobs:
  resume_plan:
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify resume is based on failed V4-C2.3 run without rerunning prepare
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor $env:BASE_HEAD HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Resume HEAD is not descended from c59435e9 V4-C2.3 baseline' }
          $stableLine = git ls-remote origin refs/heads/tinysnow-tool-only
          $stableHead = ($stableLine -split '\s+')[0]
          if ($stableHead -ne $env:STABLE_HEAD) { throw "Stable HEAD changed: $stableHead" }
          Write-Host 'PREPARE_RERUN=false'
          Write-Host 'V4C1_RETESTED=false'
          Write-Host 'V4C2_0_RETESTED=false'
          Write-Host 'V4C2_1_RETESTED=false'
          Write-Host 'V4C2_2_RETESTED=false'
      - name: Reuse successful prepare artifact from run 31951124712
        uses: actions/download-artifact@v4
        with:
          name: v4c2-3-hydration-plan
          path: artifacts/plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31951124712
      - name: Validate reused plan and export full matrix
        id: matrix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($p in @('artifacts\plan\evidence_gap_index.jsonl','artifacts\plan\gap_summary.json','artifacts\plan\canary_manifest.jsonl','artifacts\plan\matrix.json')) {
            if (-not (Test-Path $p -PathType Leaf)) { throw "Missing reused prepare artifact file: $p" }
          }
          $s = Get-Content artifacts\plan\gap_summary.json -Raw | ConvertFrom-Json
          if ([int]$s.total -ne 1378 -or [int]$s.canary_count -ne 100) { throw 'Reused prepare artifact counts changed' }
          $m = (Get-Content artifacts\plan\matrix.json -Raw).Replace("`r",'').Replace("`n",'')
          $enc = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, ("matrix=" + $m + "`n"), $enc)
          Write-Host 'REUSED_PREPARE_RUN=31951124712'
          Write-Host "HYDRATION_MATRIX=$m"

  canary:
    needs: resume_plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-3-hydration-plan
          path: artifacts/plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31951124712
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ env.REQUIREMENTS }}
      - name: Install unchanged local evidence dependencies
        shell: powershell
        run: python -m pip install --disable-pip-version-check -r $env:REQUIREMENTS
      - name: Verify only the empty artifact path hotfix
        shell: powershell
        run: |
          python -m py_compile _system\tests\v4c_hold_hydration_pathfix.py
          python _system\tests\v4c_hold_hydration_pathfix.py pathfix-self-test
      - name: Canary checkpoint seed first 25 using reused plan
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts\canary | Out-Null
          python _system\tests\v4c_hold_hydration_pathfix.py process `
            --manifest artifacts\plan\canary_manifest.jsonl `
            --semantic-evidence $env:SEMANTIC_EVIDENCE `
            --preservation-evidence $env:PRESERVATION_EVIDENCE `
            --product-context $env:PRODUCT_CONTEXT `
            --progress artifacts\canary\progress.jsonl `
            --summary artifacts\canary\seed_summary.json `
            --cache-dir artifacts\canary\visual-cache `
            --max-items 25
      - name: Resume same Canary checkpoint to 100
        shell: powershell
        run: |
          python _system\tests\v4c_hold_hydration_pathfix.py process `
            --manifest artifacts\plan\canary_manifest.jsonl `
            --semantic-evidence $env:SEMANTIC_EVIDENCE `
            --preservation-evidence $env:PRESERVATION_EVIDENCE `
            --product-context $env:PRODUCT_CONTEXT `
            --progress artifacts\canary\progress.jsonl `
            --summary artifacts\canary\resume_summary.json `
            --cache-dir artifacts\canary\visual-cache `
            --max-items 100
      - name: Validate V4-C2.3 Canary only
        shell: powershell
        run: |
          python _system\tests\v4c_hold_hydration_validate.py `
            --mode canary `
            --manifest artifacts\plan\canary_manifest.jsonl `
            --progress artifacts\canary\progress.jsonl `
            --seed-summary artifacts\canary\seed_summary.json `
            --resume-summary artifacts\canary\resume_summary.json `
            --output artifacts\canary\canary_validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-3-canary-resume-evidence
          path: |
            artifacts/canary/progress.jsonl
            artifacts/canary/seed_summary.json
            artifacts/canary/resume_summary.json
            artifacts/canary/canary_validation.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-3-canary-resume-visual
          path: artifacts/canary/visual-cache
          if-no-files-found: warn
          retention-days: 90

  full:
    needs: [resume_plan, canary]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.resume_plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-3-hydration-plan
          path: artifacts/plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31951124712
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ env.REQUIREMENTS }}
      - name: Install unchanged local evidence dependencies
        shell: powershell
        run: python -m pip install --disable-pip-version-check -r $env:REQUIREMENTS
      - name: Process this original post-Canary evidence-gap shard
        shell: powershell
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "artifacts\work\$env:SHARD"
          New-Item -ItemType Directory -Force $root | Out-Null
          python _system\tests\v4c_hold_hydration_pathfix.py process `
            --manifest ("artifacts\plan\shards\" + $env:SHARD + '.jsonl') `
            --semantic-evidence $env:SEMANTIC_EVIDENCE `
            --preservation-evidence $env:PRESERVATION_EVIDENCE `
            --product-context $env:PRODUCT_CONTEXT `
            --progress ($root + '\\' + $env:SHARD + '.evidence.jsonl') `
            --summary ($root + '\\' + $env:SHARD + '.summary.json') `
            --cache-dir ($root + '\\visual-cache')
      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-3-resume-${{ matrix.shard }}-evidence
          path: |
            artifacts/work/${{ matrix.shard }}/${{ matrix.shard }}.evidence.jsonl
            artifacts/work/${{ matrix.shard }}/${{ matrix.shard }}.summary.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-3-resume-${{ matrix.shard }}-visual
          path: artifacts/work/${{ matrix.shard }}/visual-cache
          if-no-files-found: warn
          retention-days: 90

  aggregate_and_persist:
    needs: [resume_plan, canary, full]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-3-hydration-plan
          path: artifacts/plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31951124712
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-3-canary-resume-evidence
          path: artifacts/canary
      - uses: actions/download-artifact@v4
        with:
          pattern: v4c2-3-resume-*-evidence
          path: artifacts/full-results
          merge-multiple: false
      - name: Aggregate reused 100 Canary plus all original remaining shards
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts\final | Out-Null
          python _system\tests\v4c_hold_hydration.py aggregate `
            --gap-index artifacts\plan\evidence_gap_index.jsonl `
            --results-root artifacts\full-results `
            --canary-progress artifacts\canary\progress.jsonl `
            --output artifacts\final\evidence.jsonl `
            --summary artifacts\final\final_summary.json
      - name: Full V4-C2.3 reconciliation and safety validation
        shell: powershell
        run: |
          python _system\tests\v4c_hold_hydration_validate.py `
            --mode full `
            --gap-index artifacts\plan\evidence_gap_index.jsonl `
            --evidence artifacts\final\evidence.jsonl `
            --final-summary artifacts\final\final_summary.json `
            --output artifacts\final\full_validation.json
      - name: Recheck stable branch before persistence
        shell: powershell
        run: |
          $stableLine = git ls-remote origin refs/heads/tinysnow-tool-only
          $stableHead = ($stableLine -split '\s+')[0]
          if ($stableHead -ne $env:STABLE_HEAD) { throw "Stable HEAD changed: $stableHead" }
          Write-Host 'STABLE_HEAD_UNCHANGED=true'
      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-3-hold-evidence-resume-final
          path: |
            artifacts/plan/evidence_gap_index.jsonl
            artifacts/plan/gap_summary.json
            artifacts/plan/artifact_inventory.json
            artifacts/canary/canary_validation.json
            artifacts/final/evidence.jsonl
            artifacts/final/final_summary.json
            artifacts/final/full_validation.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist only V4-C2.3 durable evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git pull --rebase origin v4c-universal-product-engine
          New-Item -ItemType Directory -Force _system\v4c\evidence_hydration | Out-Null
          Copy-Item artifacts\plan\evidence_gap_index.jsonl _system\v4c\evidence_hydration\evidence_gap_index.jsonl -Force
          Copy-Item artifacts\plan\gap_summary.json _system\v4c\evidence_hydration\gap_summary.json -Force
          Copy-Item artifacts\plan\artifact_inventory.json _system\v4c\evidence_hydration\artifact_inventory.json -Force
          Copy-Item artifacts\canary\canary_validation.json _system\v4c\evidence_hydration\canary_validation.json -Force
          Copy-Item artifacts\final\evidence.jsonl _system\v4c\evidence_hydration\evidence.jsonl -Force
          Copy-Item artifacts\final\final_summary.json _system\v4c\evidence_hydration\final_summary.json -Force
          Copy-Item artifacts\final\full_validation.json _system\v4c\evidence_hydration\validation.json -Force
          $v = Get-Content artifacts\final\full_validation.json -Raw | ConvertFrom-Json
          $lock = [ordered]@{
            schema_version = 'v4c2.3.hold-evidence-hydration-lock.1'
            passed = [bool]$v.passed
            workflow_run = $env:GITHUB_RUN_ID
            reused_prepare_run = 31951124712
            v4c2_3_base_head = $env:BASE_HEAD
            stable_head = $env:STABLE_HEAD
            total = [int]$v.input_count
            evidence_already_reusable = [int]$v.evidence_already_reusable
            visual_fetch_required = [int]$v.visual_fetch_required
            fetched = [int]$v.fetched
            sha_mismatch_source_changed = [int]$v.sha_mismatch_source_changed
            preserve = [int]$v.preserve
            needs_localization = [int]$v.needs_localization
            partial_safe = [int]$v.partial_safe
            hold = [int]$v.hold
            block = [int]$v.block
            semantic_actually_executed = [int]$v.semantic_actually_executed
            remaining = [int]$v.remaining
            empty_artifact_path_fixed = $true
            prepare_rerun = $false
            image_generation_called = $false
            tiny_snow_api_called = $false
            paid_api_called = $false
            vision_api_called = $false
            v4c1_retested = $false
            v4c2_0_retested = $false
            v4c2_1_retested = $false
            v4c2_2_retested = $false
          }
          $lock | ConvertTo-Json -Depth 20 | Set-Content _system\v4c\evidence_hydration\EVIDENCE_HYDRATION_LOCK.json -Encoding UTF8
          git config user.name 'TinySnow V4-C2.3 Hydration'
          git config user.email 'actions@users.noreply.github.com'
          git add _system/v4c/evidence_hydration
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'V4-C2.3 persist HOLD evidence hydration [skip ci]'
            git push origin HEAD:v4c-universal-product-engine
          }
          $stableLine = git ls-remote origin refs/heads/tinysnow-tool-only
          $stableHead = ($stableLine -split '\s+')[0]
          if ($stableHead -ne $env:STABLE_HEAD) { throw "Stable HEAD changed after persistence: $stableHead" }
          Write-Host 'V4C2_3_PERSISTED=true'
