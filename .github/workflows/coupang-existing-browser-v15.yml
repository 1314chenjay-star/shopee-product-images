name: Coupang Existing Browser V1.7 Full Test

on:
  push:
    branches:
      - coupang-existing-browser-v1
  workflow_dispatch:

jobs:
  full-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content 'coupang_browser_extension/manifest.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($manifest.manifest_version -ne 3) { throw 'Manifest must be V3.' }
          if ($manifest.version -ne '1.7.0') { throw 'Unexpected extension version.' }
          if ([int]$manifest.minimum_chrome_version -lt 118) { throw 'V1.7 requires Chrome 118+ debugger keepalive.' }
          $required = @('activeTab','tabs','scripting','debugger','downloads','storage','unlimitedStorage')
          foreach ($p in $required) {
            if ($manifest.permissions -notcontains $p) { throw "Missing permission: $p" }
          }
          foreach ($hostPattern in $manifest.host_permissions) {
            if ($hostPattern -notmatch '^https://.*coupang(cd?n)?\.com/') { throw "Unexpected host permission: $hostPattern" }
          }
          Write-Host 'Manifest OK'

      - name: JavaScript syntax check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node --check coupang_browser_extension/background.js
          node --check coupang_browser_extension/popup.js

      - name: V1.7 unit tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node _system/tests/coupang_browser_extension_v15_test.js

      - name: Route discovery and pagination static guard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bg = Get-Content 'coupang_browser_extension/background.js' -Raw -Encoding UTF8
          $popup = Get-Content 'coupang_browser_extension/popup.js' -Raw -Encoding UTF8
          $required = @(
            'discoverNavigationLinks',
            'chooseBestLink',
            'navigateToTarget',
            'harvestAllProductPages',
            'setProductPageSize50',
            'clickNextPage',
            'waitForTableChange',
            'MAX_PRODUCT_PAGES = 500',
            'expectedTotal',
            'pageKeys',
            'repeated_page_detected',
            'completed_with_errors'
          )
          foreach ($term in $required) {
            if (-not $bg.Contains($term) -and -not $popup.Contains($term)) { throw "V1.7 primitive missing: $term" }
          }
          $popupRequired = @('productStatusText','products.rowCount','products.pageCount','products.complete')
          foreach ($term in $popupRequired) {
            if (-not $popup.Contains($term)) { throw "Popup product-status primitive missing: $term" }
          }
          Write-Host 'Route and pagination guard OK'

      - name: Credential-access guard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bg = Get-Content 'coupang_browser_extension/background.js' -Raw -Encoding UTF8
          $forbidden = @('chrome.cookies','Network.getAllCookies','Network.getCookies','Network.getRequestPostData','Network.setExtraHTTPHeaders')
          foreach ($term in $forbidden) {
            if ($bg.Contains($term)) { throw "Forbidden credential-access primitive present: $term" }
          }
          if (-not $bg.Contains('https://wing.coupang.com/tenants/sfl-portal/delivery/management')) { throw 'Direct WING URL missing.' }
          Write-Host 'Credential-access guard OK'

      - name: Prepare single-layer release folder
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'TinySnow_Coupang_Existing_Browser_V1_7'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item 'coupang_browser_extension' -Destination $out -Recurse -Force
          if (Get-ChildItem -LiteralPath $out -Recurse -Filter '*.zip') { throw 'Nested ZIP detected.' }
          if (-not (Test-Path (Join-Path $out 'coupang_browser_extension/manifest.json'))) { throw 'Extension manifest missing from package.' }
          $manifest = Get-Content (Join-Path $out 'coupang_browser_extension/manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($manifest.version -ne '1.7.0') { throw 'Packaged manifest is not V1.7.' }
          Write-Host "Single-layer package folder OK: $out"

      - name: Upload verified single-layer build
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow_Coupang_Existing_Browser_V1_7_VERIFIED
          path: ${{ runner.temp }}\TinySnow_Coupang_Existing_Browser_V1_7\*
          if-no-files-found: error
          include-hidden-files: true
