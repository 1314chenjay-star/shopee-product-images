name: V4-C Post-C5.3 Source Preservation Guard

on:
  push:
    branches: [v4c-universal-product-engine]
    paths:
      - '_system/control/TRIGGER_POST_C5_3_SOURCE_PRESERVATION_GUARD'
  workflow_dispatch:

permissions:
  contents: write

env:
  STABLE_HEAD: 5d49f061e140813b3d229520e9e530f86b27b640
  VALIDATION: _system/control/source_preservation_guard_validation.json

jobs:
  zero-paid-source-preservation-guard:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: v4c-universal-product-engine
          fetch-depth: 0

      - name: Guard stable, sealed C5.3, and paid hold
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $stable=(git ls-remote origin refs/heads/tinysnow-tool-only).Split("`t")[0].Trim()
          if($stable -ne $env:STABLE_HEAD){ throw "Stable HEAD drifted: $stable" }
          @'
          import json
          from pathlib import Path
          cp=json.loads(Path('_system/control/execution_checkpoint.json').read_text(encoding='utf-8-sig'))
          assert cp['checkpoint']=='C5_3_COMPLETE' and not cp.get('pending'), 'C5.3_NOT_SEALED'
          q=[json.loads(x) for x in Path('_system/agent_queue/queue.jsonl').read_text(encoding='utf-8-sig').splitlines() if x.strip()]
          t=next(x for x in q if x.get('task_id')=='TASK-POST-C5-3-MINIMAL-CANARY-REVIEW')
          assert t['status']=='RECOVERING', 'CANARY_REVIEW_NOT_RECOVERING'
          assert t['mode']=='ZERO_PAID_FAILURE_ANALYSIS', 'NOT_ZERO_PAID_FAILURE_ANALYSIS'
          assert int(t.get('paid_requests_already_sent',0))==1, 'PAID_LEDGER_MISMATCH'
          assert t.get('second_paid_request_authorized') is False, 'SECOND_PAID_REQUEST_MUST_BE_HOLD'
          assert t.get('bulk_generation_authorized') is False, 'BULK_MUST_BE_HOLD'
          assert t.get('stable_mutation_authorized') is False, 'STABLE_MUTATION_MUST_BE_HOLD'
          retry=json.loads(Path('_system/control/minimal_paid_variant_canary_retry_contract.json').read_text(encoding='utf-8-sig'))
          assert retry['status']=='ZERO_PAID_IMPLEMENTATION_REQUIRED'
          assert retry['next_zero_paid_action']=='IMPLEMENT_PROTECTED_REGION_AND_DETERMINISTIC_SOURCE_PRESERVATION_GUARDS'
          print('CONTROL_GUARD=PASS')
          '@ | python -

      - name: Parse Windows PowerShell 5.1 scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('_system/guards/source_preservation_guard.ps1','_system/tests/v4c_source_preservation_guard_smoke.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors) | Out-Null
            if(@($errors).Count -gt 0){ $errors | ForEach-Object { Write-Error $_.Message }; throw "PowerShell parse failed: $p" }
          }

      - name: Run zero-paid deterministic guard smoke
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\_system\tests\v4c_source_preservation_guard_smoke.ps1
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }

      - name: Verify durable guard contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json, os
          from pathlib import Path
          v=json.loads(Path(os.environ['VALIDATION']).read_text(encoding='utf-8-sig'))
          assert v['status']=='PASS'
          assert v['zero_paid'] is True
          assert v['image_generation_called'] is False
          assert v['stable_mutation'] is False
          assert v['c5_3_rerun'] is False
          assert v['routing']['preserve']=='DETERMINISTIC_ONLY'
          assert v['routing']['cleanup']=='DETERMINISTIC_ONLY'
          assert v['routing']['unprotected_generative']=='BLOCKED_NO_PROTECTED_REGION'
          assert v['routing']['protected_generative']=='GENERATIVE_WITH_PROTECTED_REGION_RESTORE'
          assert v['negative_control_rejected'] is True
          assert v['restored_control_passed'] is True
          print('SOURCE_PRESERVATION_GUARD=PASS')
          '@ | python -

      - name: Advance zero-paid queue and next decision
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json
          from pathlib import Path
          qp=Path('_system/agent_queue/queue.jsonl')
          rows=[json.loads(x) for x in qp.read_text(encoding='utf-8-sig').splitlines() if x.strip()]
          for row in rows:
              if row.get('task_id')=='TASK-POST-C5-3-MINIMAL-CANARY-REVIEW':
                  row['status']='RECOVERING'
                  row['mode']='ZERO_PAID_GUARD_INTEGRATION'
                  row['checkpoint']='SOURCE_PRESERVATION_GUARD_PASS'
                  row['next_action']='INTEGRATE_GUARD_INTO_EXECUTION_PATH_AND_SELECT_TRUE_GENERATIVE_CANARY'
                  row['next_workflow']=None
                  row['owner_decision_required']=False
                  row['paid']=False
                  row['generation']=False
                  row['guard_validation_path']='_system/control/source_preservation_guard_validation.json'
          qp.write_text('\n'.join(json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in rows)+'\n',encoding='utf-8')
          np=Path('_system/context/next_decision.json')
          n=json.loads(np.read_text(encoding='utf-8-sig'))
          n['current_stage']='POST_C5_3_SOURCE_PRESERVATION_GUARD'
          n['next_action']='INTEGRATE_GUARD_INTO_EXECUTION_PATH_AND_SELECT_TRUE_GENERATIVE_CANARY'
          n['reason']='Zero-paid source-preservation guard passed deterministic routing, negative-control rejection, protected-region restore, and post-restore pixel QA. Next work remains zero-paid: wire the guard into the execution path and select a genuinely generative canary that has explicit authorized edit regions. No second paid request is authorized.'
          n['owner_decision_required']=False
          n['guard']={'status':'PASS','validation_path':'_system/control/source_preservation_guard_validation.json','paid_api':0,'image_generation':0,'stable_mutation':False}
          n['constraints']=list(dict.fromkeys(n.get('constraints',[])+[
              'PRESERVE/CLEANUP route deterministic-only',
              'generative edit requires explicit protected regions',
              'protected regions must be deterministically restored and QA checked before promotion',
              'no second paid request until new Owner gate'
          ]))
          np.write_text(json.dumps(n,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          '@ | python -

      - name: Recheck stable and persist only zero-paid guard evidence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $stable=(git ls-remote origin refs/heads/tinysnow-tool-only).Split("`t")[0].Trim()
          if($stable -ne $env:STABLE_HEAD){ throw "Stable HEAD changed during guard validation: $stable" }
          git config user.name 'TinySnow Source Preservation Guard Worker'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin v4c-universal-product-engine
          git add -- '_system/control/source_preservation_guard_validation.json' '_system/agent_queue/queue.jsonl' '_system/context/next_decision.json'
          $staged=@(git diff --cached --name-only)
          if($staged.Count -eq 0){ Write-Host 'No new guard evidence to persist.'; exit 0 }
          foreach($p in $staged){
            if($p -notin @('_system/control/source_preservation_guard_validation.json','_system/agent_queue/queue.jsonl','_system/context/next_decision.json')){ throw "Unexpected staged path: $p" }
          }
          git commit -m 'guard: persist zero-paid source preservation PASS [skip ci]'
          git push origin HEAD:v4c-universal-product-engine
