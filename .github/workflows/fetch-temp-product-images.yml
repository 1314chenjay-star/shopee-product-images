name: Fetch temporary product images

on:
  push:
    paths:
      - 'upload_urls/**'

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download staged product images
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(upload_urls/*.tsv)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No manifest found"
            exit 0
          fi
          for manifest in "${manifests[@]}"; do
            while IFS=$'\t' read -r filename url; do
              [ -n "${filename:-}" ] || continue
              [ -n "${url:-}" ] || continue
              echo "Fetching $filename"
              curl --location --fail --retry 3 --retry-delay 1 --connect-timeout 20 --max-time 180 "$url" --output "$filename"
              test -s "$filename"
              magic="$(od -An -tx1 -N2 "$filename" | tr -d ' \n')"
              if [ "$magic" != "ffd8" ]; then
                echo "Invalid JPEG for $filename: $magic"
                exit 1
              fi
            done < "$manifest"
            rm -f "$manifest"
          done

      - name: Commit downloaded images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Fetch verified Shopee product images [skip ci]"
          git push
