name: V4-B TinySnow Safety R3

on:
  push:
    branches:
      - v4b-original-image-localization

jobs:
  live-safety-r3:
    if: github.event.head_commit.message == 'RUN-V4B-LIVE-SAFETY-R3'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Normalize PowerShell encoding
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\_system\start\encoding_fix.ps1

      - name: V4-B planner smoke
        shell: powershell
        run: |
          & .\_system\tests\v4b_planner_smoke.ps1

      - name: V4-B source conflict cleanup smoke
        shell: powershell
        run: |
          & .\_system\tests\v4b_source_conflict_smoke.ps1

      - name: TinySnow 580 + 529 safety R3
        shell: powershell
        env:
          TINYSNOW_API_KEY: ${{ secrets.TINYSNOW_API_KEY }}
          V4B_SAFETY_ROUND: R3
          V4B_SAFETY_SLUG: r3
          V4B_ARTIFACT_NAME: TinySnow-V4-B-Safety-R3
        run: |
          & .\_system\tests\v4b_live_safety_r2.ps1

      - name: Upload V4-B safety R3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow-V4-B-Safety-R3
          path: _system/live_e2e_output_v4b_safety_r3/
          if-no-files-found: ignore
