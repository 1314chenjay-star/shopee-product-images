name: V4-C1 Source Turbo Reconcile

on:
  workflow_dispatch:
  push:
    branches:
      - v4c-universal-product-engine
    paths:
      - ".github/workflows/v4c-source-turbo-reconcile.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: v4c-source-turbo-reconcile
  cancel-in-progress: false

env:
  INVENTORY: _system/v4c/inventory/source_inventory.jsonl
  PROGRESS: _system/v4c/progress/v4c_source_progress.jsonl
  STABLE_HEAD: 5d49f061e140813b3d229520e9e530f86b27b640
  V4C_BASELINE_HEAD: 28d8eb1f024dd7ff17076b9f2fd69243164c7f6e

jobs:
  reconcile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild persisted evidence indexes without source downloads
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts\empty-shards | Out-Null
          $oldSummary = Get-Content _system\v4c\results\aggregate_summary.json -Raw -Encoding UTF8 | ConvertFrom-Json
          .\_system\tests\v4c_aggregate_results.ps1 `
            -InventoryPath $env:INVENTORY `
            -BaseProgressPath $env:PROGRESS `
            -ShardResultRoot artifacts\empty-shards `
            -OutputDir artifacts\reconciled `
            -Phase Final
          $newSummary = Get-Content artifacts\reconciled\aggregate_summary.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $newSummary.shard_result_count = [int]$oldSummary.shard_result_count
          $enc = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            "artifacts\reconciled\aggregate_summary.json",
            (($newSummary | ConvertTo-Json -Depth 10) + "`n"),
            $enc
          )
      - name: Verify duplicate map matches persisted ledger
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $progress = @(Get-Content artifacts\reconciled\v4c_source_progress.jsonl -Encoding UTF8 | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | ForEach-Object { $_ | ConvertFrom-Json })
          $map = Get-Content artifacts\reconciled\duplicate_map.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $ledgerShaDup = @($progress | Where-Object { $_.status -eq "SHA_DUPLICATE" }).Count
          $mapShaDup = @($map.sha256_duplicates).Count
          if ($ledgerShaDup -ne $mapShaDup) { throw "SHA duplicate map mismatch: ledger=$ledgerShaDup map=$mapShaDup" }
          if ($ledgerShaDup -ne 4) { throw "Expected 4 total SHA duplicate records after Turbo run, got $ledgerShaDup" }
          Write-Host "SHA_DUPLICATE_LEDGER_COUNT=$ledgerShaDup"
          Write-Host "SHA_DUPLICATE_MAP_COUNT=$mapShaDup"
          Write-Host "SOURCE_DOWNLOAD_CALLED=false"
          Write-Host "IMAGE_GENERATION_CALLED=false"
          Write-Host "TINY_SNOW_API_CALLED=false"
          Write-Host "PAID_API_CALLED=false"
      - name: Validate reconciled final progress
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\_system\tests\v4c_validate_progress.ps1 `
            -InventoryPath $env:INVENTORY `
            -ProgressPath artifacts\reconciled\v4c_source_progress.jsonl `
            -DuplicateMapPath artifacts\reconciled\duplicate_map.json `
            -FailedPath artifacts\reconciled\failed_sources.json `
            -SummaryPath artifacts\reconciled\aggregate_summary.json `
            -OutputPath artifacts\reconciled\validation.json `
            -Phase Final `
            -ExpectedStableHead $env:STABLE_HEAD `
            -V4CBaselineHead $env:V4C_BASELINE_HEAD
      - name: Persist corrected indexes on V4-C only
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item artifacts\reconciled\v4c_source_progress.jsonl _system\v4c\progress\v4c_source_progress.jsonl -Force
          Copy-Item artifacts\reconciled\source_evidence.jsonl _system\v4c\results\source_evidence.jsonl -Force
          Copy-Item artifacts\reconciled\duplicate_map.json _system\v4c\results\duplicate_map.json -Force
          Copy-Item artifacts\reconciled\failed_sources.json _system\v4c\results\failed_sources.json -Force
          Copy-Item artifacts\reconciled\semantic_evidence_queue.jsonl _system\v4c\results\semantic_evidence_queue.jsonl -Force
          Copy-Item artifacts\reconciled\aggregate_summary.json _system\v4c\results\aggregate_summary.json -Force
          Copy-Item artifacts\reconciled\validation.json _system\v4c\results\validation.json -Force
          git config user.name "TinySnow V4-C1 Turbo"
          git config user.email "actions@users.noreply.github.com"
          git add _system/v4c
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No reconciliation changes to persist."
          } else {
            git commit -m "V4-C1 reconcile complete SHA duplicate map [skip ci]"
            git push origin HEAD:v4c-universal-product-engine
          }
      - uses: actions/upload-artifact@v4
        with:
          name: v4c-turbo-reconciled
          path: artifacts/reconciled
          if-no-files-found: error
          retention-days: 14
