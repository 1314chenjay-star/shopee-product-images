name: V4-C2.4 B001-B018 Artifact Materialization Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - v4c-universal-product-engine
    paths:
      - ".github/workflows/v4c-bartifact-materialization-recovery.yml"
      - "_system/tests/v4c_bartifact_recovery.py"
      - "_system/tests/v4c_bartifact_recovery_validate.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: v4c2-4-bartifact-recovery
  cancel-in-progress: true

env:
  BASE_HEAD: 6f73d4d4abec248d66387df545de966e4d382b32
  STABLE_HEAD: 5d49f061e140813b3d229520e9e530f86b27b640
  GAP_INDEX: _system/v4c/evidence_hydration/evidence_gap_index.jsonl
  HYDRATED_EVIDENCE: _system/v4c/evidence_hydration/evidence.jsonl
  SOURCE_PROGRESS: _system/v4c/progress/v4c_source_progress.jsonl
  PRODUCT_CONTEXT: _system/v4c/semantic/bootstrap/product_context.jsonl.gz.b64
  REQUIREMENTS: _system/v4c/preservation/requirements.txt
  DURABLE_PATH: _system/v4c/evidence_hydration/bartifact_recovery/materialized_evidence.jsonl

jobs:
  plan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify all successful V4-C stages remain frozen
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor $env:BASE_HEAD HEAD
          if ($LASTEXITCODE -ne 0) { throw 'HEAD is not descended from frozen V4-C2.3 HEAD' }
          $stableLine = git ls-remote origin refs/heads/tinysnow-tool-only
          $stableHead = ($stableLine -split '\s+')[0]
          if ($stableHead -ne $env:STABLE_HEAD) { throw "Stable HEAD changed: $stableHead" }
          $frozen = @(
            '_system/v4c/inventory',
            '_system/v4c/progress',
            '_system/v4c/results',
            '_system/v4c/preservation',
            '_system/v4c/semantic/preservation',
            '_system/v4c/claim_gate',
            '_system/v4c/progressive_claim',
            '_system/v4c/evidence_hydration/EVIDENCE_HYDRATION_LOCK.json',
            '_system/v4c/evidence_hydration/canary_validation.json',
            '_system/v4c/evidence_hydration/evidence_gap_index.jsonl',
            '_system/v4c/evidence_hydration/gap_summary.json',
            '_system/v4c/evidence_hydration/evidence.jsonl',
            '_system/v4c/evidence_hydration/validation.json',
            '_system/tests/v4c_hold_hydration.py',
            '_system/tests/v4c_hold_hydration_validate.py',
            '_system/tests/v4c_claim_level_gate.py',
            '.github/workflows/v4c-hold-evidence-hydration.yml',
            '.github/workflows/v4c-hold-evidence-hydration-resume.yml',
            '_system/start/api_v2.ps1'
          )
          git diff --quiet $env:BASE_HEAD -- $frozen
          if ($LASTEXITCODE -ne 0) { throw 'A frozen successful-stage file changed' }
          Write-Host 'RERUN_1378=false'
          Write-Host 'SOURCE_REFETCH_1144=false'
          Write-Host 'COMPLETED_OCR_RERUN=false'
          Write-Host 'COMPLETED_SEMANTIC_RERUN=false'
          Write-Host 'INVENTORY_REBUILT=false'
          Write-Host 'OLD_GATE_MODIFIED=false'
          Write-Host 'OTHER_26_HOLD_TOUCHED=false'
          Write-Host 'EXISTING_13_BLOCK_TOUCHED=false'

      - name: Inventory existing B001-B018 Actions artifacts only
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts\plan | Out-Null
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $all = @()
          for ($page = 1; $page -le 10; $page++) {
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$page"
            $r = Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
            $items = @($r.artifacts)
            $all += $items
            if ($items.Count -lt 100) { break }
          }
          [ordered]@{ artifacts = $all } | ConvertTo-Json -Depth 20 | Set-Content artifacts\plan\artifact_inventory.json -Encoding UTF8
          Write-Host "ARTIFACT_INVENTORY_COUNT=$($all.Count)"
          Write-Host 'SOURCE_FETCH_CALLED=false'

      - name: Compile and self-test only V4-C2.4 recovery modules
        shell: powershell
        run: |
          python -m py_compile _system\tests\v4c_bartifact_recovery.py _system\tests\v4c_bartifact_recovery_validate.py
          python _system\tests\v4c_bartifact_recovery.py self-test

      - name: Build exact 221 target from frozen V4-C1 legacy coordinates and 40-record canary
        shell: powershell
        run: |
          python _system\tests\v4c_bartifact_recovery.py plan `
            --gap-index $env:GAP_INDEX `
            --hydrated-evidence $env:HYDRATED_EVIDENCE `
            --source-progress $env:SOURCE_PROGRESS `
            --artifact-inventory artifacts\plan\artifact_inventory.json `
            --target-out artifacts\plan\target_221.jsonl `
            --canary-out artifacts\plan\canary_40.jsonl `
            --remaining-out artifacts\plan\remaining_181.jsonl `
            --summary artifacts\plan\plan_summary.json `
            --canary-size 40

      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-4-bartifact-plan
          path: artifacts/plan
          if-no-files-found: error
          retention-days: 14

  canary:
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-4-bartifact-plan
          path: artifacts/plan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ env.REQUIREMENTS }}
      - name: Install unchanged free local evidence dependencies
        shell: powershell
        run: python -m pip install --disable-pip-version-check -r $env:REQUIREMENTS

      - name: Canary checkpoint seed first 10 materializations
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force artifacts\canary | Out-Null
          python _system\tests\v4c_bartifact_recovery.py process `
            --manifest artifacts\plan\canary_40.jsonl `
            --product-context $env:PRODUCT_CONTEXT `
            --progress artifacts\canary\progress.jsonl `
            --summary artifacts\canary\seed_summary.json `
            --artifact-cache artifacts\canary\artifact-cache `
            --evidence-repo-path $env:DURABLE_PATH `
            --max-items 10

      - name: Resume same canary checkpoint to 40
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python _system\tests\v4c_bartifact_recovery.py process `
            --manifest artifacts\plan\canary_40.jsonl `
            --product-context $env:PRODUCT_CONTEXT `
            --progress artifacts\canary\progress.jsonl `
            --summary artifacts\canary\resume_summary.json `
            --artifact-cache artifacts\canary\artifact-cache `
            --evidence-repo-path $env:DURABLE_PATH

      - name: Validate only new 40-record materialization canary
        shell: powershell
        run: |
          python _system\tests\v4c_bartifact_recovery_validate.py `
            --phase CANARY `
            --manifest artifacts\plan\canary_40.jsonl `
            --evidence artifacts\canary\progress.jsonl `
            --seed-summary artifacts\canary\seed_summary.json `
            --resume-summary artifacts\canary\resume_summary.json `
            --output artifacts\canary\validation.json

      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-4-bartifact-canary
          path: artifacts/canary
          if-no-files-found: error
          retention-days: 14

  full:
    needs: [plan, canary]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-4-bartifact-plan
          path: artifacts/plan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ env.REQUIREMENTS }}
      - name: Install unchanged free local evidence dependencies
        shell: powershell
        run: python -m pip install --disable-pip-version-check -r $env:REQUIREMENTS

      - name: Seed remaining recovery checkpoint with first 50
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force artifacts\full | Out-Null
          python _system\tests\v4c_bartifact_recovery.py process `
            --manifest artifacts\plan\remaining_181.jsonl `
            --product-context $env:PRODUCT_CONTEXT `
            --progress artifacts\full\progress.jsonl `
            --summary artifacts\full\seed_summary.json `
            --artifact-cache artifacts\full\artifact-cache `
            --evidence-repo-path $env:DURABLE_PATH `
            --max-items 50

      - name: Resume and finish remaining 181 after canary PASS
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python _system\tests\v4c_bartifact_recovery.py process `
            --manifest artifacts\plan\remaining_181.jsonl `
            --product-context $env:PRODUCT_CONTEXT `
            --progress artifacts\full\progress.jsonl `
            --summary artifacts\full\resume_summary.json `
            --artifact-cache artifacts\full\artifact-cache `
            --evidence-repo-path $env:DURABLE_PATH
          $resume = Get-Content artifacts\full\resume_summary.json -Raw | ConvertFrom-Json
          if ([int]$resume.checkpoint_existing_terminal -lt 50) { throw 'Full checkpoint did not resume from first 50' }

      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-4-bartifact-full
          path: artifacts/full
          if-no-files-found: error
          retention-days: 14

  aggregate_and_persist:
    needs: [plan, canary, full]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-4-bartifact-plan
          path: artifacts/plan
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-4-bartifact-canary
          path: artifacts/canary
      - uses: actions/download-artifact@v4
        with:
          name: v4c2-4-bartifact-full
          path: artifacts/full

      - name: Aggregate exactly 221 recovery records
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts\final | Out-Null
          python _system\tests\v4c_bartifact_recovery.py aggregate `
            --target-manifest artifacts\plan\target_221.jsonl `
            --canary-progress artifacts\canary\progress.jsonl `
            --full-progress artifacts\full\progress.jsonl `
            --output artifacts\final\materialized_evidence.jsonl `
            --summary artifacts\final\summary.json

      - name: Full V4-C2.4 reconciliation and safety validation
        shell: powershell
        run: |
          python _system\tests\v4c_bartifact_recovery_validate.py `
            --phase FULL `
            --manifest artifacts\plan\target_221.jsonl `
            --evidence artifacts\final\materialized_evidence.jsonl `
            --output artifacts\final\validation.json

      - name: Recheck stable and all frozen prior-stage files before persistence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stableLine = git ls-remote origin refs/heads/tinysnow-tool-only
          $stableHead = ($stableLine -split '\s+')[0]
          if ($stableHead -ne $env:STABLE_HEAD) { throw "Stable HEAD changed: $stableHead" }
          $frozen = @(
            '_system/v4c/inventory','_system/v4c/progress','_system/v4c/results','_system/v4c/preservation','_system/v4c/semantic/preservation','_system/v4c/claim_gate','_system/v4c/progressive_claim',
            '_system/v4c/evidence_hydration/EVIDENCE_HYDRATION_LOCK.json','_system/v4c/evidence_hydration/canary_validation.json','_system/v4c/evidence_hydration/evidence_gap_index.jsonl','_system/v4c/evidence_hydration/gap_summary.json','_system/v4c/evidence_hydration/evidence.jsonl','_system/v4c/evidence_hydration/validation.json',
            '_system/tests/v4c_hold_hydration.py','_system/tests/v4c_hold_hydration_validate.py','_system/tests/v4c_claim_level_gate.py','.github/workflows/v4c-hold-evidence-hydration.yml','.github/workflows/v4c-hold-evidence-hydration-resume.yml','_system/start/api_v2.ps1'
          )
          git diff --quiet $env:BASE_HEAD -- $frozen
          if ($LASTEXITCODE -ne 0) { throw 'Frozen prior-stage file changed during V4-C2.4' }
          Write-Host "STABLE_HEAD=$stableHead"

      - name: Build V4-C2.4 lock and persist only new recovery evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = '_system\v4c\evidence_hydration\bartifact_recovery'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item artifacts\plan\target_221.jsonl "$dst\target_221.jsonl" -Force
          Copy-Item artifacts\plan\plan_summary.json "$dst\plan_summary.json" -Force
          Copy-Item artifacts\canary\validation.json "$dst\canary_validation.json" -Force
          Copy-Item artifacts\final\materialized_evidence.jsonl "$dst\materialized_evidence.jsonl" -Force
          Copy-Item artifacts\final\summary.json "$dst\summary.json" -Force
          Copy-Item artifacts\final\validation.json "$dst\validation.json" -Force
          $s = Get-Content artifacts\final\summary.json -Raw | ConvertFrom-Json
          $lock = [ordered]@{
            schema_version = 'v4c2.4.bartifact-recovery-lock.2'
            passed = $true
            workflow_run = "$env:GITHUB_RUN_ID"
            base_head = $env:BASE_HEAD
            stable_head = $env:STABLE_HEAD
            target = [int]$s.target
            artifact_found = [int]$s.artifact_found
            artifact_not_found = [int]$s.artifact_not_found
            sha_matched = [int]$s.sha_matched
            sha_mismatch = [int]$s.sha_mismatch
            preserve = [int]$s.preserve
            needs_localization = [int]$s.needs_localization
            partial_safe = [int]$s.partial_safe
            hold_remaining = [int]$s.hold_remaining
            block = [int]$s.block
            legacy_coordinate_mapping = $true
            source_fetch_called = $false
            semantic_inference_executed = $false
            image_generation_called = $false
            tiny_snow_api_called = $false
            paid_api_called = $false
            vision_api_called = $false
            rerun_1378 = $false
            source_refetch_1144 = $false
            completed_ocr_rerun = $false
            completed_semantic_rerun = $false
            inventory_rebuilt = $false
            other_26_hold_touched = $false
            existing_13_block_touched = $false
          }
          $lock | ConvertTo-Json -Depth 20 | Set-Content "$dst\BARTIFACT_RECOVERY_LOCK.json" -Encoding UTF8
          git config user.name 'TinySnow V4-C2.4 Artifact Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add _system/v4c/evidence_hydration/bartifact_recovery
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'V4-C2.4 persist B001-B018 artifact materialization recovery [skip ci]'
            git push origin HEAD:v4c-universal-product-engine
          }

      - uses: actions/upload-artifact@v4
        with:
          name: v4c2-4-bartifact-recovery-final
          path: artifacts/final
          if-no-files-found: error
          retention-days: 30
