name: TinySnow Agent Queue Idle Watchdog

on:
  push:
    branches: [v4c-universal-product-engine]
    paths:
      - '_system/control/**'
      - '_system/agent_queue/**'
      - '_system/context/**'
      - '_system/source_truth/product_identity_record.schema.json'
      - '_system/governance/TINYSNOW_CONTROL_PLANE_CONTRACT.md'
      - '.github/workflows/tinysnow-idle-watchdog.yml'
      - '.github/workflows/v4c-source-truth-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: tinysnow-idle-watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    env:
      TINYSNOW_TARGET_BRANCH: v4c-universal-product-engine
    steps:
      - uses: actions/checkout@v4

      - name: Control plane preflight
        run: |
          python -m py_compile _system/control/control_plane_preflight.py
          python -B _system/control/control_plane_preflight.py --role SUPERVISOR --write-intent dispatch_recovery

      - name: Probe Decision Layer command inbox on heartbeat
        shell: bash
        env:
          TINYSNOW_STABLE_HEAD_EXPECTED: 5d49f061e140813b3d229520e9e530f86b27b640
        run: |
          set -euo pipefail
          STABLE=$(git ls-remote origin refs/heads/tinysnow-tool-only | awk '{print $1}')
          test "$STABLE" = "$TINYSNOW_STABLE_HEAD_EXPECTED"
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          inbox=root/'_system/agent_queue/inbox/pending_commands.jsonl'
          rows=[json.loads(x) for x in inbox.read_text(encoding='utf-8-sig').splitlines() if x.strip()] if inbox.exists() else []
          pending=[x for x in rows if x.get('status')=='PENDING']
          if not pending:
              print(json.dumps({'command_inbox_read':True,'pending_command':False,'authority_probe':'IDLE'},sort_keys=True))
              raise SystemExit(0)
          cmd=sorted(pending,key=lambda x:(int(x.get('priority',999)),str(x.get('created_at','')),str(x.get('command_id',''))))[0]
          checkpoint=json.load(open(root/'_system/control/execution_checkpoint.json',encoding='utf-8-sig'))
          decision=json.load(open(root/'_system/context/next_decision.json',encoding='utf-8-sig'))
          policy=json.load(open(root/'_system/control/command_policy.json',encoding='utf-8-sig'))
          retry=json.load(open(root/'_system/control/retry_policy.json',encoding='utf-8-sig'))
          required=['command_id','created_at','priority','action','scope','reason','allowed_operations','forbidden_operations','required_validation','status','issuer_role','repository_full_name','branch','task_id','expected_checkpoint','observed_head','idempotency_key']
          assert all(k in cmd for k in required), 'COMMAND_SCHEMA_REQUIRED_FIELD_MISSING'
          assert cmd['issuer_role']=='ORCHESTRATOR', 'COMMAND_ISSUER_ROLE_FORBIDDEN'
          assert cmd['repository_full_name']=='1314chenjay-star/shopee-product-images', 'COMMAND_REPOSITORY_MISMATCH'
          assert cmd['branch']=='v4c-universal-product-engine', 'COMMAND_BRANCH_MISMATCH'
          assert cmd['expected_checkpoint']==checkpoint['checkpoint'], 'STALE_COMMAND_CHECKPOINT'
          assert cmd['action'] in policy['auto_allowed_actions'], 'COMMAND_REQUIRES_OWNER_OR_UNKNOWN_ACTION'
          allowed=set(map(str,cmd.get('allowed_operations',[])))
          forbidden=set(map(str,cmd.get('forbidden_operations',[])))
          owner=set(map(str,policy.get('owner_approval_required_operations',[])))
          decision_forbidden=set(map(str,decision.get('forbidden_actions',[])))
          assert not (allowed & forbidden), 'ALLOWED_FORBIDDEN_OVERLAP'
          assert not (allowed & owner), 'OWNER_APPROVAL_BOUNDARY'
          assert not (allowed & decision_forbidden), 'NEXT_DECISION_FORBIDDEN_OPERATION'
          assert int(cmd.get('retry_count',0)) <= int(retry['max_retry_count']), 'RETRY_LIMIT_EXCEEDED_BLOCKED_STATE_ANALYSIS'
          print(json.dumps({'command_inbox_read':True,'pending_command':True,'command_id':cmd['command_id'],'checkpoint':checkpoint['checkpoint'],'authority_probe':'PASS','non_consuming':True},sort_keys=True))
          PY

      - name: Validate capability recovery and handoff queue
        run: python -B _system/agent_queue/validate_agent_queue.py

      - name: Evaluate idle recovery decision and timeout guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -B _system/agent_queue/watchdog.py

      - name: Dispatch safe next workflow when idle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          r=json.load(open('_system/agent_queue/recovery_report.json',encoding='utf-8'))
          t=r.get('pending_task') or {}
          decision=r.get('decision')
          wf=t.get('next_workflow')
          status={'decision':decision,'workflow':wf,'dispatched':False}
          if decision=='AUTO_RECOVER' and wf:
              p=pathlib.Path('.github/workflows')/wf
              if p.exists(): status['dispatch_requested']=True
              else: status['dispatch_block']='DECLARED_RECOVERY_WORKFLOW_NOT_YET_PRESENT'
          elif decision=='STALLED_WORKER': status['dispatch_block']='TIMEOUT_GUARD_SUPPRESSED_ORIGINAL_TASK_RETRY'
          pathlib.Path('_system/agent_queue/recovery_dispatch_status.json').write_text(json.dumps(status,indent=2)+'\n',encoding='utf-8')
          PY
          if python -c "import json; x=json.load(open('_system/agent_queue/recovery_dispatch_status.json')); raise SystemExit(0 if x.get('dispatch_requested') else 1)"; then
            WF=$(python -c "import json; print(json.load(open('_system/agent_queue/recovery_dispatch_status.json'))['workflow'])")
            gh workflow run "$WF" --ref v4c-universal-product-engine || true
          fi

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: tinysnow-agent-watchdog-${{ github.run_id }}
          path: |
            _system/agent_queue/validation.json
            _system/agent_queue/recovery_report.json
            _system/agent_queue/recovery_dispatch_status.json
            _system/control/stalled_execution_report.json
            _system/control/timeout_policy.json
            _system/control/live_status.json
          if-no-files-found: error
          retention-days: 14

  recover-first-pending-delta:
    needs: watchdog
    permissions:
      contents: write
    uses: ./.github/workflows/v4c-c5-3-delta-recovery-bridge.yml
