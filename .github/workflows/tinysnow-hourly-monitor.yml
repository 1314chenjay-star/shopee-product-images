name: TinySnow Durable Hourly Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: v4c-universal-product-engine

      - name: Read TinySnow state and decide
        shell: bash
        run: |
          mkdir -p _system/reports
          python3 <<'PY'
          import json, pathlib, datetime
          base = pathlib.Path('.')

          def read_json(path):
              p = base / path
              if not p.exists():
                  return {'present': False}
              try:
                  return json.loads(p.read_text())
              except Exception:
                  return {'present': True, 'parse': 'failed'}

          checkpoint = read_json('_system/control/execution_checkpoint.json')
          queue = read_json('_system/agent_queue/queue.jsonl')
          preflight = read_json('_system/control/protected_generative_canary_preflight.json')
          canary = read_json('_system/control/second_minimal_protected_canary_result.json')

          decision = 'HOLD'
          action = 'NO_ACTION'

          checkpoint_text = json.dumps(checkpoint, ensure_ascii=False)
          if 'PASS' in checkpoint_text or 'COMPLETE' in checkpoint_text:
              decision = 'VERIFY_NEXT_STAGE'
              action = 'CHECK_CANARY_OR_NEXT_SAFE_TASK'

          if 'FAIL' in json.dumps(canary, ensure_ascii=False):
              decision = 'DIAGNOSE'
              action = 'ANALYZE_MINIMAL_FAILURE_SCOPE'

          report = {
              'monitor': 'tinysnow-hourly',
              'role': 'MONITOR_ORCHESTRATOR_VERIFY',
              'timestamp': datetime.datetime.utcnow().isoformat() + 'Z',
              'branch': 'v4c-universal-product-engine',
              'decision': decision,
              'action': action,
              'checkpoint': checkpoint,
              'queue': queue,
              'preflight': preflight,
              'canary': canary
          }

          pathlib.Path('_system/reports/tinysnow_hourly_monitor.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2)
          )
          PY

      - name: Commit durable monitor report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _system/reports/tinysnow_hourly_monitor.json
          git commit -m "chore: update TinySnow durable monitor report" || echo "no changes"
          git push || echo "no push needed"
