name: V4-C0 Free Universal Smoke

on:
  push:
    branches:
      - v4c-universal-product-engine
  workflow_dispatch:

jobs:
  v4c0-free-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Normalize PowerShell encoding
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\_system\start\encoding_fix.ps1

      - name: V4-C0 universal product engine smoke
        shell: powershell
        run: |
          & .\_system\tests\v4c0_universal_smoke.ps1

      - name: Confirm no paid image workflow assets are invoked
        shell: powershell
        run: |
          $test = Get-Content -LiteralPath '.\_system\tests\v4c0_universal_smoke.ps1' -Raw
          if ($test -match 'image_gen|OpenAI|Invoke-RestMethod|api_v2') {
            throw 'V4-C0 free smoke unexpectedly references paid/API transport code.'
          }
          Write-Host 'V4-C0 free-analysis boundary: PASS'
