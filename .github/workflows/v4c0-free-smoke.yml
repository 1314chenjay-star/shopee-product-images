name: V4-C0 Free Universal Smoke

on:
  push:
    branches:
      - v4c-universal-product-engine
  workflow_dispatch:

jobs:
  v4c0-free-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Normalize PowerShell encoding
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\_system\start\encoding_fix.ps1

      - name: V4-C0 universal product engine smoke
        shell: powershell
        run: |
          & .\_system\tests\v4c0_universal_smoke.ps1

      - name: V4-C0 Shopee Excel adapter smoke
        shell: powershell
        run: |
          & .\_system\tests\v4c0_excel_adapter_smoke.ps1

      - name: V4-C0 full catalog routing regression smoke
        shell: powershell
        run: |
          & .\_system\tests\v4c0_full_catalog_router_smoke.ps1

      - name: V4-C0 catalog analyzer and review gate smoke
        shell: powershell
        run: |
          & .\_system\tests\v4c0_catalog_analyzer_smoke.ps1

      - name: V4-C0 B001 product-body routing smoke
        shell: powershell
        run: |
          & .\_system\tests\v4c0_b001_product_body_smoke.ps1

      - name: V4-C0 semantic review manifest smoke
        shell: powershell
        run: |
          & .\_system\tests\v4c0_semantic_manifest_smoke.ps1

      - name: V4-C0 B001 semantic result gate smoke
        shell: powershell
        run: |
          & .\_system\tests\v4c0_semantic_result_gate_smoke.ps1

      - name: V4-C0 B002 chained semantic gate smoke
        shell: powershell
        run: |
          & .\_system\tests\v4c0_b002_semantic_chain_smoke.ps1

      - name: Confirm V4-C0 remains free-analysis only
        shell: powershell
        run: |
          $files = @(
            Get-ChildItem -LiteralPath '.\_system\start' -File -Filter 'v4c_*.ps1'
            Get-ChildItem -LiteralPath '.\_system\tests' -File -Filter 'v4c0_*smoke.ps1'
          )
          foreach ($file in $files) {
            $text = Get-Content -LiteralPath $file.FullName -Raw
            if ($text -match '(?i)Invoke-RestMethod|api_v2|openai|image_gen') {
              throw ('V4-C0 free-analysis boundary violation: ' + $file.Name)
            }
          }
          Write-Host 'V4-C0 free-analysis boundary: PASS'
