name: V4-A.2 TinySnow Live E2E

on:
  push:
    branches:
      - v4a1-factual-guard

jobs:
  live:
    if: github.event.head_commit.message == 'RUN-LIVE-E2E'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Normalize PowerShell encoding
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\_system\start\encoding_fix.ps1

      - name: V4-A baseline smoke
        shell: powershell
        run: |
          & .\_system\tests\windows_smoke.ps1

      - name: V4-A.1 factual smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a1_windows_smoke.ps1

      - name: V4-A.2 Reference Safety smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a2_reference_safety_smoke.ps1

      - name: V4-A.2 Taiwan localization smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a2_taiwan_localization_smoke.ps1

      - name: TinySnow five-product Taiwan Reference Safety live batch
        shell: powershell
        env:
          TINYSNOW_API_KEY: ${{ secrets.TINYSNOW_API_KEY }}
        run: |
          $path = '.\_system\tests\v4a2_live_batch.ps1'
          $lines = @(Get-Content -LiteralPath $path -Encoding UTF8)
          $changed = 0
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -like "*'2米','30磅','腰帶','黑色'*") {
              $lines[$i] = $lines[$i].Replace("'2米'", "'2公尺'")
              $changed++
            }
            if ($lines[$i] -like "*Reference Safety prompt missing for*") {
              $lines[$i] = ''
            }
          }
          if ($changed -lt 1) { throw 'Live compatibility patch did not find the legacy 2米 assertion.' }
          $lines | Set-Content -LiteralPath $path -Encoding UTF8
          $patched = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          if ($patched -match "@\('2米','30磅','腰帶','黑色'\)") { throw 'Legacy 2米 assertion still exists after patch.' }
          if ($patched -notmatch "@\('2公尺','30磅','腰帶','黑色'\)") { throw 'Taiwan 2公尺 assertion was not installed.' }
          & $path

      - name: Upload live result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow-V4-A.2-5Product-TaiwanReferenceSafety
          path: _system/live_e2e_output/
          if-no-files-found: ignore
