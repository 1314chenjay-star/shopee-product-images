name: V4-A.2.1 TinySnow Live E2E

on:
  push:
    branches:
      - v4a1-factual-guard

jobs:
  live:
    if: github.event.head_commit.message == 'RUN-LIVE-E2E'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Normalize PowerShell encoding
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\_system\start\encoding_fix.ps1

      - name: V4-A baseline smoke
        shell: powershell
        run: |
          & .\_system\tests\windows_smoke.ps1

      - name: V4-A.1 factual smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a1_windows_smoke.ps1

      - name: V4-A.2 Reference Safety smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a2_reference_safety_smoke.ps1

      - name: V4-A.2 Taiwan localization smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a2_taiwan_localization_smoke.ps1

      - name: V4-A.2.1 image text stability smoke
        shell: powershell
        run: |
          & .\_system\tests\v4a21_text_stability_smoke.ps1

      - name: TinySnow 529 detail4 plus full 580 five-slot live batch
        shell: powershell
        env:
          TINYSNOW_API_KEY: ${{ secrets.TINYSNOW_API_KEY }}
        run: |
          & .\_system\tests\v4a21_live_text_stability.ps1

      - name: Upload live result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow-V4-A.2.1-TextStability-Live
          path: _system/live_e2e_output_v4a21/
          if-no-files-found: ignore
