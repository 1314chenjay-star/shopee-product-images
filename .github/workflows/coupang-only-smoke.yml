name: Coupang Only V1.4 Full Test

on:
  push:
    branches:
      - coupang-only-v1
  workflow_dispatch:

jobs:
  full-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell 5.1 syntax check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            '_system/start/coupang_local_collector.ps1',
            '_system/start/coupang_existing_session.ps1',
            '_system/start/coupang_v13_hardening.ps1',
            '_system/start/coupang_only.ps1',
            '_system/tests/coupang_v13_selftest.ps1',
            '_system/tests/coupang_v14_selftest.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $file, $_.Message) }
              throw "PowerShell syntax check failed: $file"
            }
            Write-Host "Syntax OK: $file"
          }

      - name: V1.3 Windows functional regression test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & "$PWD/_system/tests/coupang_v13_selftest.ps1"

      - name: V1.4 direct-entry self-test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & "$PWD/_system/tests/coupang_v14_selftest.ps1"

      - name: Prepare single-layer Coupang-only V1.4 build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'TinySnow_Coupang_Only_V1_4'
          $startDir = Join-Path $out '_system\start'
          New-Item -ItemType Directory -Path $startDir -Force | Out-Null
          Copy-Item 'START.bat' -Destination $out -Force
          Copy-Item 'README_COUPANG.txt' -Destination $out -Force
          Copy-Item '_system/start/coupang_local_collector.ps1' -Destination $startDir -Force
          Copy-Item '_system/start/coupang_existing_session.ps1' -Destination $startDir -Force
          Copy-Item '_system/start/coupang_v13_hardening.ps1' -Destination $startDir -Force
          Copy-Item '_system/start/coupang_only.ps1' -Destination $startDir -Force

          if (-not (Test-Path (Join-Path $out 'START.bat'))) { throw 'START.bat missing from prepared build.' }
          if (-not (Test-Path (Join-Path $out '_system\start\coupang_only.ps1'))) { throw 'Runtime script missing from prepared build.' }
          $nestedZip = @(Get-ChildItem -LiteralPath $out -Recurse -File -Filter '*.zip')
          if ($nestedZip.Count -gt 0) { throw 'Prepared build contains a nested ZIP; users would need to unzip twice.' }
          Write-Host 'Single-layer build OK: no nested ZIP files.'

      - name: Upload verified single-layer build
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow_Coupang_Only_V1_4_VERIFIED
          path: ${{ runner.temp }}\TinySnow_Coupang_Only_V1_4\**
          if-no-files-found: error
