name: Coupang Only V1 Smoke

on:
  push:
    branches:
      - coupang-only-v1
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell 5.1 syntax check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            '_system/start/coupang_local_collector.ps1',
            '_system/start/coupang_only.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $file, $_.Message) }
              throw "PowerShell syntax check failed: $file"
            }
            Write-Host "Syntax OK: $file"
          }

      - name: Package Coupang-only build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'TinySnow_Coupang_Only_V1'
          $startDir = Join-Path $out '_system\start'
          New-Item -ItemType Directory -Path $startDir -Force | Out-Null
          Copy-Item 'START.bat' -Destination $out -Force
          Copy-Item 'README_酷澎版.txt' -Destination $out -Force
          Copy-Item '_system/start/coupang_local_collector.ps1' -Destination $startDir -Force
          Copy-Item '_system/start/coupang_only.ps1' -Destination $startDir -Force
          $zip = Join-Path $env:RUNNER_TEMP 'TinySnow_Coupang_Only_V1.zip'
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Package: $zip"

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: TinySnow_Coupang_Only_V1
          path: ${{ runner.temp }}\TinySnow_Coupang_Only_V1.zip
          if-no-files-found: error
