<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TinySnow Coupang</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>TinySnow｜Coupang V1.7</h1>
    <p class="sub">直接使用你目前已登入的 Chrome / Edge，不複製 Cookie。</p>
    <div id="status" class="status">讀取狀態中…</div>

    <button id="focusWing">1. 切到已登入的 WING 分頁</button>
    <button id="autoCrawl" class="primary">2. 一鍵全店採集（商品自動翻到最後一頁）</button>
    <button id="stopAutoCrawl">3. 停止自動採集</button>
    <button id="exportData" class="primary">4. 匯出完整採集資料 JSON</button>

    <details>
      <summary>備用功能</summary>
      <button id="openBackend">直接進配送管理後台</button>
      <button id="clearData" class="danger">清空本機採集資料</button>
    </details>

    <p class="note">V1.7 會優先尋找 WING 真實 href／路由，不再只靠模擬點左側文字。商品列表若有多頁，會自動嘗試切到每頁 50 件，持續按下一頁並逐頁保存，直到最後一頁或達到後台顯示的商品總數。</p>
    <p class="note">採集保留商品、SKU、價格、庫存、訂單與營運資料；密碼、Cookie、登入 Token、Authorization，以及買家電話／Email／地址會遮蔽。</p>
    <p id="message" class="message"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
